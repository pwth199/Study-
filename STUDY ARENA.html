<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Arena – Khu Vườn Tri Thức & Linh Vật Mochi</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g-deep:#0f382c;
  --g-dark:#1b4332;
  --g-main:#2d6a4f;
  --g-leaf:#40916c;
  --g-mint:#52b788;
  --g-soft:#74c69d;
  --g-light:#d8f3dc;
  --sun-gold:#ffb703;
  --sun-soft:#fff3c4;
  --dew-cyan:#2ec4b6;
  --wood-card:#ffffff;
}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:linear-gradient(135deg,#e8f5e9 0%,#f1faee 50%,#e0f2fe 100%);
  color:#152e24;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  transition:background 0.5s ease;
}
h1,h2,h3,.font-fun{font-family:'Quicksand',sans-serif}
.card{
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(12px);
  border-radius:24px;
  padding:22px;
  border:1px solid rgba(82,183,136,0.25);
  box-shadow:0 10px 30px -10px rgba(15,56,44,0.08),0 2px 6px rgba(15,56,44,0.04);
  transition:all .25s ease;
}
.card:hover{box-shadow:0 14px 36px -10px rgba(45,106,79,0.15)}
.btn{
  background:linear-gradient(135deg,#2d6a4f,#1b4332);
  color:#fff;
  border-radius:14px;
  padding:10px 18px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 4px 12px rgba(45,106,79,0.2);
  transition:all .2s ease;
  cursor:pointer;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(45,106,79,0.3);background:linear-gradient(135deg,#40916c,#2d6a4f)}
.btn:active{transform:translateY(0)}
.btn.g{background:linear-gradient(135deg,#2ec4b6,#1b7b72);color:#fff}
.btn.g:hover{background:linear-gradient(135deg,#36d7c8,#209388)}
.btn.y{background:linear-gradient(135deg,#ffb703,#fb8500);color:#fff;box-shadow:0 4px 12px rgba(251,133,0,0.25)}
.btn.y:hover{background:linear-gradient(135deg,#ffc32b,#f77f00)}
.btn.rose{background:linear-gradient(135deg,#ff4d6d,#c9184a);color:#fff}
.btn.outline{background:transparent;border:2px solid #52b788;color:#2d6a4f;box-shadow:none}
.btn.outline:hover{background:#d8f3dc}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.tab{
  padding:9px 18px;
  border-radius:999px;
  font-weight:700;
  font-size:14px;
  color:#2d6a4f;
  transition:all .2s ease;
  cursor:pointer;
}
.tab:hover{background:rgba(82,183,136,0.18)}
.tab.on{
  background:linear-gradient(135deg,#2d6a4f,#1b4332);
  color:#fff;
  box-shadow:0 4px 14px rgba(45,106,79,0.25);
}
.opt{
  border:2px solid #d8f3dc;
  border-radius:16px;
  padding:12px 18px;
  text-align:left;
  width:100%;
  margin-top:10px;
  background:#fff;
  font-weight:600;
  transition:all .2s ease;
  cursor:pointer;
}
.opt:hover{border-color:#52b788;background:#f8fdf9;transform:translateX(3px)}
.ok{border-color:#2ec4b6!important;background:#e6faf7!important;color:#0b524b;box-shadow:0 0 0 2px rgba(46,196,182,0.3)}
.no{border-color:#ff6b6b!important;background:#fff0f0!important;color:#851a1a;box-shadow:0 0 0 2px rgba(255,107,107,0.3)}
input,select,textarea{
  border:2px solid #d8f3dc;
  border-radius:14px;
  padding:10px 14px;
  width:100%;
  background:#fcfefd;
  transition:all .2s;
}
input:focus,select:focus,textarea:focus{
  border-color:#52b788;
  outline:none;
  background:#fff;
  box-shadow:0 0 0 4px rgba(82,183,136,0.15);
}
.bar{height:12px;border-radius:999px;background:#e2f5e8;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#52b788,#2ec4b6,#ffb703);transition:width .4s ease}
.lock{filter:grayscale(0.85);opacity:.45}
@keyframes floatGarden{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-8px) rotate(1deg)}
}
.anim-float{animation:floatGarden 4s ease-in-out infinite}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 15px rgba(46,196,182,0.3)}
  50%{box-shadow:0 0 30px rgba(82,183,136,0.6)}
}
.anim-glow{animation:pulseGlow 3s infinite}
@keyframes pop{50%{transform:scale(1.2)}}
.pop{animation:pop .45s ease}
#leafCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
header,main,footer,#modal,#toast,#adminModal{position:relative;z-index:10}
.admin-badge{
  background:linear-gradient(135deg,#ffb703,#e76f51);
  color:#fff;
  border-radius:999px;
  padding:3px 10px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
/* HIỆU ỨNG CON ĐƯỜNG THĂNG TIÊN */
.path-node{
  position:relative;
  transition:all .3s ease;
}
.path-node:hover{
  transform:scale(1.02);
}
.path-line{
  width:4px;
  height:42px;
  background:linear-gradient(180deg,#52b788,#2ec4b6);
  margin:0 auto;
}
</style>
</head>
<body>
<canvas id="leafCanvas"></canvas>

<!-- THANH HEADER KHU VƯỜN (MỌI TƯƠNG TÁC ĐIỀU KHIỂN NẰM Ở ĐÂY) -->
<header class="max-w-6xl mx-auto px-4 pt-4">
  <div class="flex items-center justify-between flex-wrap gap-3">
    <!-- LOGO VÀ TÊN HỆ THỐNG (ADMIN CÓ THỂ ĐỔI) -->
    <div class="flex items-center gap-3 cursor-pointer" onclick="go('learn')">
      <div id="siteLogoWrap" class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-2xl shadow-lg shadow-emerald-700/20 anim-float overflow-hidden">
        <span id="siteLogoIcon">🌿</span>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span id="siteTitle" class="text-2xl font-extrabold tracking-tight text-emerald-950 font-fun">Study Arena</span>
          <span id="siteTag" class="bg-emerald-100 text-emerald-800 text-[11px] font-bold px-2.5 py-0.5 rounded-full border border-emerald-300">Vườn Tri Thức</span>
        </div>
        <div id="siteSub" class="text-xs font-semibold text-emerald-700">Nuôi dưỡng linh vật Mochi qua từng bài học</div>
      </div>
    </div>

    <!-- KHU VỰC ĐIỀU KHIỂN TRÊN CÙNG: ÂM THANH - QUẢN TRỊ ADMIN - ĐĂNG NHẬP -->
    <div class="flex items-center gap-2 flex-wrap">
      <!-- Nút Âm Thanh -->
      <button class="btn sm outline" onclick="toggleAudio()" id="btnAudio" title="Bật/Tắt âm thanh khu vườn">
        🔊 Âm thanh
      </button>

      <!-- Nút QUẢN TRỊ ADMIN (NÚT CHÍNH ĐỂ MỞ TOÀN BỘ QUYỀN) -->
      <button class="btn sm y" onclick="openAdminModal()" id="btnAdminNav" title="Mở trung tâm quản trị toàn năng">
        <span>⚙️</span> <span>Quản Trị Vườn</span>
      </button>

      <!-- Nút ĐĂNG NHẬP / NGƯỜI DÙNG Ở TRÊN CÙNG -->
      <div id="auth"></div>
    </div>
  </div>

  <!-- NAVIGATION TABS & CHIP TIẾN TRÌNH -->
  <div class="flex flex-wrap items-center gap-3 justify-between mt-4 pb-2 border-b border-emerald-200/60">
    <nav class="flex gap-1 bg-white/80 p-1.5 rounded-full shadow-sm border border-emerald-200/70" id="nav"></nav>
    <div id="chip" class="font-bold text-xs sm:text-sm text-emerald-900 bg-emerald-100/90 px-3.5 py-1.5 rounded-full border border-emerald-300 shadow-sm flex items-center gap-2"></div>
  </div>
</header>

<!-- GIAO DIỆN CHÍNH -->
<main id="app" class="max-w-6xl mx-auto p-4 mb-12"></main>

<!-- MODAL ĐĂNG NHẬP (MỞ TỪ NÚT ĐĂNG NHẬP Ở TRÊN CÙNG) -->
<div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="card max-w-sm w-full text-center p-6 border-2 border-emerald-200 shadow-2xl">
    <div class="text-5xl mb-2">🌸</div>
    <h2 class="font-extrabold text-xl text-emerald-950 font-fun">Đăng Nhập Tài Khoản</h2>
    <p class="text-xs text-emerald-700 mt-1 mb-4">Lưu trữ mầm non và đồng bộ tiến độ học</p>
    <button class="btn w-full" onclick="login('Google')">Tiếp tục với Google</button>
    <button class="btn g w-full mt-2.5" onclick="login('Facebook')">Tiếp tục với Facebook</button>
    <button class="btn outline sm w-full mt-2.5" onclick="login('Khách Vãng Lai')">Học ẩn danh (Khách)</button>
    <button class="mt-4 text-xs font-bold text-slate-500 hover:text-emerald-700 underline" onclick="$('#modal').classList.add('hidden');$('#modal').classList.remove('flex')">Đóng</button>
  </div>
</div>

<!-- MODAL QUẢN TRỊ ADMIN ĐẦY ĐỦ TIỆN ÍCH -->
<div id="adminModal" class="fixed inset-0 bg-emerald-950/60 backdrop-blur-md hidden items-center justify-center p-3 sm:p-5 overflow-y-auto">
  <div class="card max-w-4xl w-full max-h-[92vh] flex flex-col p-4 sm:p-6 border-2 border-amber-300 shadow-2xl relative">
    <div class="flex items-center justify-between border-b border-emerald-200 pb-3 mb-4">
      <div class="flex items-center gap-2">
        <span class="text-3xl">🌿</span>
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-xl font-extrabold text-emerald-950 font-fun">Trung Tâm Quản Trị Vườn Tri Thức</h2>
            <span class="admin-badge">Admin Master</span>
          </div>
          <p class="text-xs text-emerald-700 font-medium">Đổi tên, đổi ảnh giao diện, đổi mật khẩu và quản lý toàn diện</p>
        </div>
      </div>
      <button class="w-8 h-8 rounded-full bg-emerald-100 hover:bg-emerald-200 text-emerald-900 font-extrabold flex items-center justify-center" onclick="closeAdminModal()">✕</button>
    </div>

    <!-- NỘI DUNG ADMIN BODY -->
    <div id="adminBody" class="flex-1 overflow-y-auto pr-1"></div>
  </div>
</div>

<!-- THÔNG BÁO TOAST DẠNG GIỌT SƯƠNG -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gradient-to-r from-emerald-900 to-teal-900 text-white font-bold text-sm px-5 py-3 rounded-2xl shadow-2xl border border-emerald-400 hidden items-center gap-2 z-50 transition-all"></div>

<script>
/* ==================== 1. KHỞI TẠO TIỆN ÍCH CỐT LÕI ==================== */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const TODAY=()=>new Date().toDateString();

/* ==================== 2. CẤU HÌNH GIAO DIỆN & TÊN (ADMIN TÙY BIẾN) ==================== */
const DEFAULT_CFG={
  siteName:'Study Arena',
  siteTag:'Vườn Tri Thức',
  siteSub:'Nuôi dưỡng linh vật Mochi qua từng bài học',
  petName:'Mochi',
  bgTheme:'morning', // morning, fairy, twilight, sakura, custom
  customBgUrl:'',
  logoIcon:'🌿',
  customLogoUrl:'',
  customPetUrl:''
};

/* ==================== 3. ÂM THANH WEBAUDIO (OFFLINE) ==================== */
const Sound={
  ctx:null,
  init(){
    if(!this.ctx){
      try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
    }
    if(this.ctx&&this.ctx.state==='suspended'){
      try{this.ctx.resume()}catch(e){}
    }
  },
  drop(){
    if(!S||S.muted)return;this.init();
    try{
      if(!this.ctx)return;
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(500,this.ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1200,this.ctx.currentTime+0.12);
      g.gain.setValueAtTime(0.25,this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.12);
      o.connect(g);g.connect(this.ctx.destination);
      o.start();o.stop(this.ctx.currentTime+0.12);
    }catch(e){}
  },
  correct(){
    if(!S||S.muted)return;this.init();
    try{
      if(!this.ctx)return;
      [523.25,659.25,783.99].forEach((f,i)=>{
        const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.type='triangle';o.frequency.setValueAtTime(f,this.ctx.currentTime+i*0.08);
        g.gain.setValueAtTime(0.2,this.ctx.currentTime+i*0.08);
        g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+i*0.08+0.25);
        o.connect(g);g.connect(this.ctx.destination);
        o.start(this.ctx.currentTime+i*0.08);o.stop(this.ctx.currentTime+i*0.08+0.25);
      });
    }catch(e){}
  },
  tada(){
    if(!S||S.muted)return;this.init();
    try{
      if(!this.ctx)return;
      [440,554.37,659.25,880].forEach((f,i)=>{
        const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.type='sine';o.frequency.setValueAtTime(f,this.ctx.currentTime+i*0.1);
        g.gain.setValueAtTime(0.3,this.ctx.currentTime+i*0.1);
        g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+i*0.1+0.4);
        o.connect(g);g.connect(this.ctx.destination);
        o.start(this.ctx.currentTime+i*0.1);o.stop(this.ctx.currentTime+i*0.1+0.4);
      });
    }catch(e){}
  }
};
function toggleAudio(){
  S.muted=!S.muted;save();
  const b=$('#btnAudio');if(b)b.innerHTML=S.muted?'🔇 Đã tắt':'🔊 Âm thanh';
  toast(S.muted?'Đã tắt âm thanh khu vườn':'Đã bật âm thanh sinh động');
}

/* ==================== 4. DỮ LIỆU CỐT LÕI (TOÁN GIẢI TÍCH) ==================== */
const DEFAULT_TOPICS=[
  'Giới hạn dãy số và hàm số',
  'Hàm liên tục',
  'Đạo hàm và vi phân',
  'Ứng dụng đạo hàm: cực trị, tiệm cận',
  'Tích phân bất định',
  'Tích phân xác định',
  'Tích phân suy rộng',
  'Chuỗi số và tiêu chuẩn hội tụ'
];
const DEFAULT_KNOW=[
  'Định nghĩa giới hạn và các dạng vô định (0/0, ∞/∞)',
  'Quy tắc L’Hôpital',
  'Định nghĩa đạo hàm bằng giới hạn của tỉ số số gia',
  'Điều kiện cần của cực trị (định lý Fermat)',
  'Công thức Newton–Leibniz',
  'Tiêu chuẩn so sánh và d’Alembert cho chuỗi'
];
const DEFAULT_MCQ=[
 {q:'lim (x→0) sin x / x bằng?',o:['0','1','∞','Không tồn tại'],a:1,e:'Đây là giới hạn cơ bản, bằng 1.'},
 {q:'Đạo hàm của f(x) = x²·eˣ là?',o:['2x·eˣ','x²·eˣ','(2x + x²)·eˣ','2x + eˣ'],a:2,e:'Quy tắc tích: (uv)′ = u′v + uv′ = 2x·eˣ + x²·eˣ.'},
 {q:'∫₀¹ 2x dx bằng?',o:['0','1','2','1/2'],a:1,e:'Nguyên hàm là x², thay cận: 1² − 0² = 1.'},
 {q:'Chuỗi Σ 1/n² (n ≥ 1) có tính chất nào?',o:['Phân kỳ','Hội tụ','Dao động','Không xác định'],a:1,e:'Chuỗi p với p = 2 > 1 nên hội tụ.'},
 {q:'Hàm |x| tại x = 0?',o:['Liên tục, khả vi','Liên tục, không khả vi','Gián đoạn','Khả vi, không liên tục'],a:1,e:'Đạo hàm trái là −1, đạo hàm phải là 1 nên không khả vi, nhưng hàm vẫn liên tục.'}
];
const DEFAULT_ESSAY=[
 {q:'Tìm cực trị của f(x) = x³ − 3x + 2 và trình bày các bước.',h:'Tính f′(x), giải f′(x) = 0, lập bảng biến thiên hoặc xét dấu f″(x).'},
 {q:'Chứng minh nếu f khả vi tại a thì f liên tục tại a.',h:'Viết f(x) − f(a) = [(f(x) − f(a))/(x − a)]·(x − a), rồi cho x → a.'}
];
const DEFAULT_ORAL=[
 {q:'Em hãy phát biểu định nghĩa đạo hàm của hàm số tại một điểm.',k:['giới hạn','lim','tỉ số','số gia'],hint:'Hãy nghĩ tới giới hạn của tỉ số giữa số gia hàm số và số gia đối số.'},
 {q:'Về mặt hình học, đạo hàm tại x₀ biểu diễn điều gì?',k:['tiếp tuyến','hệ số góc','độ dốc'],hint:'Nghĩ về đường thẳng chạm đồ thị tại điểm đó.'},
 {q:'Hàm liên tục có chắc khả vi không? Cho một ví dụ.',k:['|x|','trị tuyệt đối','không khả vi','không'],hint:'Thử xét hàm có “góc nhọn” tại gốc tọa độ.'},
 {q:'Cuối cùng, định lý Fermat nói gì về cực trị và đạo hàm?',k:['bằng 0','=0','cực trị','điều kiện cần'],hint:'Nếu hàm khả vi và đạt cực trị tại x₀ thì f′(x₀) có giá trị nào?'}
];

let CONTENT={
  MCQ:[...DEFAULT_MCQ],
  ESSAY:[...DEFAULT_ESSAY],
  ORAL:[...DEFAULT_ORAL],
  TOPICS:[...DEFAULT_TOPICS],
  KNOW:[...DEFAULT_KNOW]
};

try{
  const savedC=JSON.parse(localStorage.getItem('sa_garden_content')||localStorage.getItem('sa_content')||'{}');
  for(const k in savedC){
    if(CONTENT[k]&&Array.isArray(savedC[k])&&savedC[k].length>0){
      CONTENT[k]=savedC[k];
    }
  }
}catch(e){}

function saveContent(){
  try{
    localStorage.setItem('sa_garden_content',JSON.stringify(CONTENT));
    localStorage.setItem('sa_content',JSON.stringify(CONTENT));
  }catch(e){}
}

/* ==================== 5. TRẠNG THÁI NGƯỜI DÙNG & TÙY BIẾN ==================== */
const defaultSt = { kt: 40, vd: 30, gn: 35, bp: 25, px: 30 };
let S={
  xp:45,
  streak:1,
  last:TODAY(),
  done:1,
  grade:'Đại học năm 1',
  subject:'Toán giải tích',
  hrs:2,
  files:[],
  focus:[...DEFAULT_KNOW],
  plan:[],
  tab:'learn',
  petTab:'garden', // 'garden' (Phòng) hoặc 'ascend' (Lộ Trình Thăng Tiên)
  exam:'mcq',
  remind:'20:00',
  mode:'week4',
  user:null,
  muted:false,
  st:{...defaultSt},
  cfg:{...DEFAULT_CFG}
};

try{
  const savedS=JSON.parse(localStorage.getItem('mochi_garden')||localStorage.getItem('mochi')||'{}');
  Object.assign(S,savedS);
}catch(e){}

if(!S.st||typeof S.st!=='object') S.st={...defaultSt};
else S.st=Object.assign({...defaultSt},S.st);
if(!S.cfg||typeof S.cfg!=='object') S.cfg={...DEFAULT_CFG};
else S.cfg=Object.assign({...DEFAULT_CFG},S.cfg);
if(!S.mode) S.mode='week4';
if(!S.hrs) S.hrs=2;
if(!S.tab) S.tab='learn';
if(!S.petTab) S.petTab='garden';
if(!S.exam) S.exam='mcq';
if(!S.remind) S.remind='20:00';
if(S.xp===undefined||isNaN(S.xp)) S.xp=45;
if(S.streak===undefined||isNaN(S.streak)) S.streak=1;
if(!S.focus||!Array.isArray(S.focus)||!S.focus.length) S.focus=[...CONTENT.KNOW];

const save=()=>{
  try{
    localStorage.setItem('mochi_garden',JSON.stringify(S));
    localStorage.setItem('mochi',JSON.stringify(S));
  }catch(e){}
};

const lvl=()=>Math.min(10,Math.floor((S.xp||0)/60)+1);

function toast(m){
  const t=$('#toast');if(!t)return;
  t.innerHTML=`<span>✨</span> <span>${m}</span>`;
  t.classList.remove('hidden');t.classList.add('flex');
  clearTimeout(toast.h);toast.h=setTimeout(()=>{t.classList.add('hidden');t.classList.remove('flex')},2500);
}

function gain(xp,k,d){
  const before=lvl();
  if(S.last!==TODAY()){
    const y=new Date(Date.now()-864e5).toDateString();
    S.streak=S.last===y?S.streak+1:1;S.last=TODAY();
  }
  S.xp=(S.xp||0)+xp;
  if(k&&S.st&&S.st[k]!==undefined) S.st[k]=Math.min(100,S.st[k]+d);
  save();
  Sound.drop();
  if(lvl()>before){
    Sound.tada();
    toast(`Chúc mừng! ${S.cfg.petName} đã Đột Phá Thăng Cấp ${lvl()}! 🎉`);
  }else{
    toast(`+${xp} Giọt sương tri thức (XP)`);
  }
  head();
}

  const st=$('#siteTitle'),sg=$('#siteTag'),sb=$('#siteSub');
  if(st) st.textContent=cfg.siteName||'Study Arena';

  // Logo
  const lw=$('#siteLogoWrap'),li=$('#siteLogoIcon');
  if(lw&&li){
    if(cfg.customLogoUrl){
      lw.innerHTML=`<img src="${cfg.customLogoUrl}" class="w-full h-full object-cover">`;
    }else{
      lw.innerHTML=`<span id="siteLogoIcon">${cfg.logoIcon||'🌿'}</span>`;
    }

  // Hình nền
  if(cfg.customBgUrl){
    document.body.style.background=`url('${cfg.customBgUrl}') center/cover fixed no-repeat`;
  }else if(cfg.bgTheme==='fairy'){
    document.body.style.background='linear-gradient(135deg, #fce7f3 0%, #e0e7ff 50%, #fef3c7 100%)';
  }else if(cfg.bgTheme==='twilight'){
    document.body.style.background='linear-gradient(135deg, #064e3b 0%, #0f172a 50%, #1e1b4b 100%)';
  }else if(cfg.bgTheme==='sakura'){
    document.body.style.background='linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #f0fdf4 100%)';
  }else{

}

];
const unit=()=>S.mode==='day7'?'Ngày':'Tuần';
const tevery=()=>S.mode==='day7'?3:2;

const rng=i=>{
  const mode=S.mode||'week4';
  const D={day7:7,week4:28,week12:90}[mode]||28;
  const N={day7:7,week4:4,week12:12}[mode]||4;
  return [Math.round(i*D/N)+1, Math.round((i+1)*D/N)];
};
const hrsOf=i=>{
  const r=rng(i);
  return (S.hrs||2)*(r[1]-r[0]+1);
};
const lab=i=>{
  const[a,b]=rng(i);
  return (S.mode==='day7')?'Ngày '+(i+1):'Tuần '+(i+1)+' (Tháng '+(Math.floor((a-1)/30)+1)+', ngày '+a+'–'+b+')';
};

function upload(f){
  if(!f||!f.length)return;
  S.files=[...f].map(x=>x.name);
  const a=$('#aiStatus');
  if(a) a.innerHTML='<span class="inline-block animate-spin mr-1">🔄</span> AI đang đọc tài liệu và lọc kiến thức trọng tâm…';
  setTimeout(()=>{
    S.focus=[...CONTENT.KNOW];
    save();
    gain(20,'bp',12);
    toast('Đã phân tích tài liệu! Mochi hấp thu thêm dinh dưỡng');
    render();
  },1200);
}

function suggest(){
  const it=(S.focus&&S.focus.length)?S.focus:CONTENT.TOPICS;
  const modeMap={day7:7,week4:4,week12:12};
  const N=modeMap[S.mode]||4;
  S.plan=Array.from({length:N},(_,i)=>{
    const a=Math.floor(i*it.length/N),b=Math.floor((i+1)*it.length/N);
    return{
      t:b>a?it.slice(a,b).join('; '):'Tổng ôn chuyên đề & luyện đề củng cố phản xạ',
      d:i===0
    };
  });
  save();
  Sound.correct();
  toast('Đã cập nhật lộ trình học tập thông minh!');
  render();
}

function mv(i,d){
  const j=i+d;if(j<0||j>=S.plan.length)return;
  [S.plan[i],S.plan[j]]=[S.plan[j],S.plan[i]];
  save();render();
}

function doneWeek(i,v){
  if(S.plan&&S.plan[i]){
    S.plan[i].d=v;
    if(v){gain(25,'gn',8);Sound.correct();toast(`Xuất sắc! Hoàn thành ${lab(i)} 🎉`)}
    else save();
  }
}

function submitEssay(i){
  const ta=$('#es_'+i);if(!ta)return;

  if(v.length<20){

function vOral(){

  if(!O.log.length&&!O.over){

    <div class="pt-3 border-t border-emerald-100">

        <div class="text-center">
          <p class="text-xs font-bold text-emerald-800 mb-2">Em đã hoàn thành trọn vẹn buổi vấn đáp với Thầy AI!</p>

        </div>
      `:`
        <div class="flex gap-2">
          <input id="oaInput" placeholder="Gõ câu trả lời của em…" onkeydown="if(event.key==='Enter')ansOral()" class="text-xs sm:text-sm">
          <button class="btn outline sm hidden sm:inline-flex" onclick="micOral()" title="Nói qua micro (nếu trình duyệt hỗ trợ)">🎙️</button>
          <button class="btn g sm" onclick="ansOral()">Gửi</button>
        </div>
      `}
    </div>
  </div>
  `;
}

function speakLastAI(){
  if(!('speechSynthesis' in window)){toast('Trình duyệt chưa hỗ trợ Text-to-Speech');return}
  try{
    const lastAi=[...O.log].reverse().find(m=>m.r==='ai');
    if(!lastAi)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(lastAi.t);
    u.lang='vi-VN';u.rate=0.95;
    window.speechSynthesis.speak(u);
  }catch(e){toast('Không thể phát âm: '+e.message)}
}

function micOral(){
  try{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast('Trình duyệt chưa hỗ trợ nhận diện giọng nói, em hãy gõ bàn phím nhé');return}
    const r=new SR();r.lang='vi-VN';
    toast('Đang lắng nghe câu trả lời…');
    r.onresult=e=>{
      const txt=e.results[0][0].transcript;
      const inp=$('#oaInput');if(inp)inp.value=txt;
      toast('Đã nhận: "'+txt+'"');
    };
    r.onerror=e=>{toast('Lỗi micro: '+(e.error||'không thể nhận diện'))};
    r.start();
  }catch(e){toast('Micro: '+e.message)}
}

function ansOral(){
  const el=$('#oaInput');if(!el)return;
  const v=el.value.trim();if(!v)return;
  O.log.push({r:'u',t:v});
  const list=CONTENT.ORAL||[];
  const q=list[O.i];
  if(!q){render();return}
  const hit=(q.k||[]).some(k=>v.toLowerCase().includes(k.toLowerCase()));

  if(hit||O.tries>=1){
    const reply=(hit?'Tốt, ý của em đúng hướng. ':'Không sao, thầy giải thích nhanh: '+(q.hint||'')+' ')+
      (O.i+1<list.length?'Đi sâu hơn nhé: '+list[O.i+1].q:'Đó là câu cuối. Em đã hoàn thành buổi vấn đáp!');
    O.log.push({r:'ai',t:reply});
    if(hit){gain(15,'vd',10);Sound.correct()}else{gain(5,'vd',4)}
    O.i++;O.tries=0;
    if(O.i>=list.length){O.over=true;S.done++;save()}
  }else{
    O.tries++;
    O.log.push({r:'ai',t:'Chưa đủ ý. '+(q.hint||'')+' Em thử lại nhé.'});
  }
  render();
  setTimeout(()=>{const b=$('#chatBox');if(b)b.scrollTop=b.scrollHeight},50);
}

function radar(){
  const L=['Kiến thức','Vấn đáp','Ghi nhớ','Độ bao phủ','Phản xạ'],K=['kt','vd','gn','bp','px'],c=110,R=78;
  const P=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[(c+r*Math.cos(a)).toFixed(1),(c+r*Math.sin(a)).toFixed(1)]};
  const poly=K.map((k,i)=>P(i,R*((S.st&&S.st[k])||20)/100).join(',')).join(' ');
  return `
  <svg viewBox="0 0 220 220" class="w-full max-w-[270px] mx-auto select-none" role="img" aria-label="Biểu đồ radar 5 chiều">
    ${[.33,.66,1].map(f=>`<polygon points="${K.map((k,i)=>P(i,R*f).join(',')).join(' ')}" fill="none" stroke="#b7e4c7" stroke-width="1.2" stroke-dasharray="${f===1?'none':'2,2'}"/>`).join('')}
    <polygon points="${poly}" fill="rgba(46,196,182,0.4)" stroke="#2ec4b6" stroke-width="2.5"/>
    ${K.map((k,i)=>{const[x,y]=P(i,R*((S.st&&S.st[k])||20)/100);return`<circle cx="${x}" cy="${y}" r="3.5" fill="#1b4332"/>`}).join('')}
    ${L.map((l,i)=>{const[x,y]=P(i,R+18);return`<text x="${x}" y="${y}" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0f382c">${l} (${(S.st&&S.st[K[i]])||0}%)</text>`}).join('')}
  </svg>
  `;
}

function remind(){
  if(!('Notification' in window)){toast('Trình duyệt chưa hỗ trợ thông báo');return}
  try{
    Notification.requestPermission().then(p=>{
      if(p==='granted'){
        try{new Notification(`${S.cfg.petName} nhắc bạn`,{body:'Đến giờ học rồi, khu vườn đang chờ!'})}catch(e){}
        toast('Đã bật nhắc nhở lúc '+S.remind);
      }else toast('Bạn chưa cho phép thông báo');
    }).catch(e=>{toast('Thông báo: '+e.message)});
  }catch(e){toast('Thông báo: '+e.message)}
}
setInterval(()=>{
  try{
    const n=new Date(),h=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    if(h===S.remind&&S.last!==TODAY()){
      toast(`Đến giờ học rồi, ${S.cfg.petName} đang chờ!`);
      if('Notification' in window&&Notification.permission==='granted'){
        try{new Notification('Đến giờ học rồi!',{body:`${S.cfg.petName} đang chờ em học bài.`})}catch(e){}
      }
    }
  }catch(e){}
},30000);

/* --- TAB 5: QUẢN LÝ VẤN ĐÁP --- */
function vAdminOral(){
  return `
  <div>
    <div class="flex items-center justify-between mb-3">
      <h4 class="font-extrabold text-sm text-emerald-950 uppercase tracking-wider">Danh Sách Câu Hỏi Vấn Đáp Thầy AI</h4>
      <button class="btn g sm" onclick="showAddOralForm()">+ Thêm Câu Vấn Đáp</button>
    </div>

    <div id="addOralBox" class="p-4 mb-4 bg-emerald-50 rounded-2xl border-2 border-emerald-300 hidden">
      <h5 class="font-bold text-sm text-emerald-950 mb-2">Thêm Câu Hỏi Vấn Đáp:</h5>
      <input id="newOr_q" placeholder="Câu hỏi của Thầy AI…" class="mb-2 text-xs font-semibold">
      <input id="newOr_k" placeholder="Từ khóa chấm đúng (cách nhau bằng dấu phẩy, vd: giới hạn, lim, số gia)…" class="mb-2 text-xs">
      <textarea id="newOr_h" rows="2" placeholder="Gợi ý dẫn dắt khi học viên trả lời chưa đủ ý…" class="text-xs mb-3"></textarea>
      <div class="flex gap-2">
        <button class="btn g sm" onclick="saveNewOral()">Lưu Câu Vấn Đáp</button>
        <button class="btn outline sm" onclick="$('#addOralBox').classList.add('hidden')">Hủy</button>
      </div>
    </div>

    <div class="space-y-3 max-h-96 overflow-y-auto pr-1">
      ${CONTENT.ORAL.map((o,idx)=>`
        <div class="p-3 bg-white rounded-2xl border border-emerald-200 text-xs">
          <div class="flex items-start justify-between gap-2">
            <div class="font-bold text-emerald-950 text-sm">Câu ${idx+1}. ${o.q}</div>
            <button class="text-rose-600 font-bold hover:underline" onclick="delOral(${idx})">Xóa</button>
          </div>
          <div class="mt-1.5 flex flex-wrap gap-1">
            <span class="text-slate-500 font-semibold">Từ khóa bắt:</span>
            ${(o.k||[]).map(k=>`<span class="bg-teal-100 text-teal-800 px-2 py-0.5 rounded font-mono font-bold">${k}</span>`).join('')}
          </div>
          <div class="mt-1 text-slate-600 italic">Gợi ý định hướng: ${o.hint||''}</div>
        </div>
      `).join('')}
    </div>
  </div>
  `;
}
function showAddOralForm(){$('#addOralBox').classList.remove('hidden')}
function saveNewOral(){
  const q=$('#newOr_q').value.trim(),k=$('#newOr_k').value.split(',').map(x=>x.trim()).filter(Boolean),h=$('#newOr_h').value.trim();
  if(!q||!k.length){toast('Vui lòng điền câu hỏi và ít nhất 1 từ khóa');return}
  CONTENT.ORAL.push({q,k,hint:h||'Hãy nghĩ tới khái niệm cốt lõi.'});
  saveContent();toast('Đã thêm câu hỏi vấn đáp!');renderAdminView();render();
}
function delOral(i){
  if(CONTENT.ORAL.length<=1){toast('Cần giữ ít nhất 1 câu vấn đáp');return}
  CONTENT.ORAL.splice(i,1);saveContent();toast('Đã xóa câu vấn đáp');renderAdminView();render();
}

/* --- TAB 6: CHỦ ĐỀ & TRỌNG TÂM --- */
function vAdminTopics(){
  return `
  <div class="space-y-4">
    <div>
      <h4 class="font-extrabold text-sm text-emerald-950 mb-1">Chủ Đề Ôn Tập (Mỗi dòng một chủ đề):</h4>
      <textarea id="ad_topics_raw" rows="6" class="text-xs font-medium">${CONTENT.TOPICS.join('\n')}</textarea>
    </div>
    <div>
      <h4 class="font-extrabold text-sm text-emerald-950 mb-1">Kiến Thức Trọng Tâm (Mỗi dòng một ý):</h4>
      <textarea id="ad_know_raw" rows="6" class="text-xs font-medium">${CONTENT.KNOW.join('\n')}</textarea>
    </div>
    <button class="btn g sm" onclick="saveTopicsAndKnow()">Lưu Chủ Đề & Kiến Thức</button>
  </div>
  `;
}
function saveTopicsAndKnow(){
  const t=$('#ad_topics_raw').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const k=$('#ad_know_raw').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(t.length)CONTENT.TOPICS=t;
  if(k.length){CONTENT.KNOW=k;S.focus=k;}
  saveContent();save();
  toast('Đã lưu chủ đề và kiến thức trọng tâm mới!');render();
}

/* --- TAB 7: ĐIỂM & CẤP ĐỘ --- */
function vAdminCheats(){
  return `
  <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200">
    <h4 class="font-extrabold text-sm text-emerald-950 mb-3 uppercase tracking-wider">Công Cụ Trợ Lực Nhanh (Dành Cho Kiểm Thử):</h4>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
      <button class="btn sm g" onclick="gain(60,'kt',15);toast('Đã cộng +60 XP!')">+60 XP (Lên 1 Cấp)</button>
      <button class="btn sm y" onclick="S.xp=540;save();toast('Đã đạt Cảnh Giới Độ Kiếp!');render()">🌲 Đắc Đạo Độ Kiếp (Cấp 10)</button>
      <button class="btn sm outline" onclick="S.streak+=3;save();toast('Đã tăng chuỗi +3 ngày!');render()">🔥 Tăng Chuỗi +3 Ngày</button>
      <button class="btn sm outline" onclick="S.done+=5;save();toast('Mở khóa Cúp vàng!');render()">🏆 Mở Khóa Đồ Trang Trí</button>
      <button class="btn sm g" onclick="S.st={kt:95,vd:90,gn:92,bp:88,px:96};save();toast('Tối đa hóa radar!');render()">📊 Max Biểu Đồ Radar</button>
      <button class="btn sm rose" onclick="resetAllData()">⚠️ Khôi Phục Dữ Liệu Gốc</button>
    </div>
  </div>
  `;
}
function resetAllData(){
  if(confirm('Bạn có chắc muốn đặt lại toàn bộ tiến độ học và dữ liệu về mặc định ban đầu?')){
    localStorage.removeItem('mochi_garden');
    localStorage.removeItem('mochi');
    localStorage.removeItem('sa_garden_content');
    localStorage.removeItem('sa_content');
    localStorage.removeItem('sa_admin_pin');
    location.reload();
  }
}

/* --- TAB 8: JSON & BACKUP --- */
function vAdminJson(){
  return `
  <div class="space-y-4">
    <p class="text-xs text-slate-600">Sửa dưới dạng JSON: câu trắc nghiệm, tự luận, vấn đáp, chủ đề và kiến thức trọng tâm.</p>
    <textarea id="ad_json_full" rows="10" class="font-mono text-xs">${JSON.stringify(CONTENT,null,2).replace(/</g,'&lt;')}</textarea>
    <div class="flex flex-wrap gap-2">
      <button class="btn g sm" onclick="saveFullJson()">Lưu Thay Đổi JSON</button>
      <button class="btn y sm" onclick="exportJsonBackup()">📥 Tải File JSON Dự Phòng</button>
      <label class="btn outline sm cursor-pointer">
        📤 Nhập File JSON
        <input type="file" accept=".json" class="hidden" onchange="importJsonBackup(this.files)">
      </label>
      <button class="btn rose sm" onclick="exportStandaloneHtml()">🌐 Xuất Bản File HTML Độc Lập</button>
    </div>
  </div>
  `;
}

function saveFullJson(){
  try{
    const o=JSON.parse($('#ad_json_full').value);
    Object.assign(CONTENT,o);saveContent();
    toast('Đã lưu nội dung JSON!');render();
  }catch(e){toast('JSON chưa hợp lệ: '+e.message)}
}
function exportJsonBackup(){
  const blob=new Blob([JSON.stringify(CONTENT,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='study-arena-database.json';a.click();
  toast('Đã tải file sao lưu JSON!');
}
function importJsonBackup(files){
  if(!files.length)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      Object.assign(CONTENT,d);saveContent();toast('Đã nạp dữ liệu từ file JSON!');
      renderAdminView();render();
    }catch(err){toast('File JSON không hợp lệ')}
  };
  r.readAsText(files[0]);
}
function exportStandaloneHtml(){
  const fullHtml=document.documentElement.outerHTML;
  const b=new Blob(['<!doctype html>\n'+fullHtml],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='STUDY-ARENA-HOAN-CHINH.html';a.click();
  toast('Đã xuất bản file HTML độc lập chứa dữ liệu mới nhất!');
}

/* ==================== 13. HIỆU ỨNG LÁ BAY KHU VƯỜN (CANVAS) ==================== */
function setupGardenCanvas(){
  const cv=document.getElementById('leafCanvas');
  if(!cv)return;
  const cx=cv.getContext('2d');
  let W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;
  window.addEventListener('resize',()=>{W=cv.width=window.innerWidth;H=cv.height=window.innerHeight});
  const leaves=Array.from({length:20},()=>({
    x:Math.random()*W,y:Math.random()*H,sz:Math.random()*12+8,
    vx:Math.random()*0.8-0.2,vy:Math.random()*0.8+0.4,
    ang:Math.random()*Math.PI*2,va:Math.random()*0.02-0.01,
    c:['rgba(82,183,136,0.3)','rgba(46,196,182,0.25)','rgba(255,183,3,0.25)','rgba(116,198,157,0.3)'][Math.floor(Math.random()*4)]
  }));
  function loop(){
    cx.clearRect(0,0,W,H);
    for(const l of leaves){
      l.x+=l.vx;l.y+=l.vy;l.ang+=l.va;
      if(l.y>H+20){l.y=-20;l.x=Math.random()*W}
      if(l.x>W+20)l.x=-20;if(l.x<-20)l.x=W+20;
      cx.save();cx.translate(l.x,l.y);cx.rotate(l.ang);
      cx.fillStyle=l.c;cx.beginPath();
      cx.ellipse(0,0,l.sz,l.sz*0.5,0,0,Math.PI*2);cx.fill();
      cx.restore();
    }
    requestAnimationFrame(loop);
  }
  loop();
}

/* ==================== 14. KHỞI CHẠY GIAO DIỆN ==================== */
setupGardenCanvas();
render();
</script>
