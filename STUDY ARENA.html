<style>
:root{
  --g-deep:#0f382c;
  --g-dark:#1b4332;
  --g-main:#2d6a4f;
  --g-leaf:#40916c;
  --g-mint:#52b788;
  --g-soft:#74c69d;
  --g-light:#d8f3dc;
  --sun-gold:#ffb703;
  --sun-soft:#fff3c4;
  --dew-cyan:#2ec4b6;
  --wood-card:#ffffff;
}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:linear-gradient(135deg,#e8f5e9 0%,#f1faee 50%,#e0f2fe 100%);
  color:#152e24;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  transition:background 0.5s ease;
}
h1,h2,h3,.font-fun{font-family:'Quicksand',sans-serif}
.card{
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(12px);
  border-radius:24px;
  padding:22px;
  border:1px solid rgba(82,183,136,0.25);
  box-shadow:0 10px 30px -10px rgba(15,56,44,0.08),0 2px 6px rgba(15,56,44,0.04);
  transition:all .25s ease;
}
.card:hover{box-shadow:0 14px 36px -10px rgba(45,106,79,0.15)}
.btn{
  background:linear-gradient(135deg,#2d6a4f,#1b4332);
  color:#fff;
  border-radius:14px;
  padding:10px 18px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 4px 12px rgba(45,106,79,0.2);
  transition:all .2s ease;
  cursor:pointer;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(45,106,79,0.3);background:linear-gradient(135deg,#40916c,#2d6a4f)}
.btn:active{transform:translateY(0)}
.btn.g{background:linear-gradient(135deg,#2ec4b6,#1b7b72);color:#fff}
.btn.g:hover{background:linear-gradient(135deg,#36d7c8,#209388)}
.btn.y{background:linear-gradient(135deg,#ffb703,#fb8500);color:#fff;box-shadow:0 4px 12px rgba(251,133,0,0.25)}
.btn.y:hover{background:linear-gradient(135deg,#ffc32b,#f77f00)}
.btn.rose{background:linear-gradient(135deg,#ff4d6d,#c9184a);color:#fff}
.btn.outline{background:transparent;border:2px solid #52b788;color:#2d6a4f;box-shadow:none}
.btn.outline:hover{background:#d8f3dc}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.tab{
  padding:9px 18px;
  border-radius:999px;
  font-weight:700;
  font-size:14px;
  color:#2d6a4f;
  transition:all .2s ease;
  cursor:pointer;
}
.tab:hover{background:rgba(82,183,136,0.18)}
.tab.on{
  background:linear-gradient(135deg,#2d6a4f,#1b4332);
  color:#fff;
  box-shadow:0 4px 14px rgba(45,106,79,0.25);
}
.opt{
  border:2px solid #d8f3dc;
  border-radius:16px;
  padding:12px 18px;
  text-align:left;
  width:100%;
  margin-top:10px;
  background:#fff;
  font-weight:600;
  transition:all .2s ease;
  cursor:pointer;
}
.opt:hover{border-color:#52b788;background:#f8fdf9;transform:translateX(3px)}
.ok{border-color:#2ec4b6!important;background:#e6faf7!important;color:#0b524b;box-shadow:0 0 0 2px rgba(46,196,182,0.3)}
.no{border-color:#ff6b6b!important;background:#fff0f0!important;color:#851a1a;box-shadow:0 0 0 2px rgba(255,107,107,0.3)}
input,select,textarea{
  border:2px solid #d8f3dc;
  border-radius:14px;
  padding:10px 14px;
  width:100%;
  background:#fcfefd;
  transition:all .2s;

input:focus,select:focus,textarea:focus{
  border-color:#52b788;
  outline:none;
  background:#fff;
  box-shadow:0 0 0 4px rgba(82,183,136,0.15);

.bar{height:12px;border-radius:999px;background:#e2f5e8;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#52b788,#2ec4b6,#ffb703);transition:width .4s ease}
.lock{filter:grayscale(0.85);opacity:.45}
@keyframes floatGarden{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-8px) rotate(1deg)}
}
.anim-float{animation:floatGarden 4s ease-in-out infinite}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 15px rgba(46,196,182,0.3)}
  50%{box-shadow:0 0 30px rgba(82,183,136,0.6)}
}
.anim-glow{animation:pulseGlow 3s infinite}
@keyframes pop{50%{transform:scale(1.2)}}
.pop{animation:pop .45s ease}
#leafCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
header{position:relative;z-index:100}
main{position:relative;z-index:10}
footer{position:relative;z-index:10}
#toast{position:fixed;z-index:99999}

/* POPUP DROPDOWN TRÊN CÙNG (ĐÈ LÊN GIAO DIỆN MỘT CÁCH GỌN GÀNG, KHÔNG BỊ CHE KHUẤT) */
.popup-dropdown {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: 320px;
  max-width: min(340px, calc(100vw - 32px));
  background: #ffffff;
  border-radius: 20px;
  padding: 16px 18px;
  box-shadow: 0 20px 45px -10px rgba(15, 56, 44, 0.28), 0 4px 16px rgba(15, 56, 44, 0.08);
  z-index: 9999;
  animation: fadeInDown 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.popup-dropdown.admin-dropdown {
  border: 2px solid #fcd34d;
}
.popup-dropdown.auth-dropdown {
  border: 2px solid #6ee7b7;
}
.popup-dropdown::before {
  content: '';
  position: absolute;
  top: -7px;
  right: 24px;
  width: 12px;
  height: 12px;
  background: #ffffff;
  transform: rotate(45deg);
  border-top: 2px solid;
  border-left: 2px solid;
  border-color: inherit;
  z-index: 10000;
}
@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.admin-badge{
  background:linear-gradient(135deg,#ffb703,#e76f51);
  color:#fff;
  border-radius:999px;
  padding:3px 10px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.path-node{
  position:relative;
  transition:all .3s ease;
}
.path-node:hover{
  transform:scale(1.02);
}
.path-line{
  width:4px;
  height:42px;
  background:linear-gradient(180deg,#52b788,#2ec4b6);
  margin:0 auto;
}

function fileToBase64(file, callback){
  if(!file)return;
  if(file.size > 2 * 1024 * 1024){
    toast('Ảnh quá lớn (vui lòng chọn ảnh dưới 2MB)');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => callback(e.target.result);
  reader.readAsDataURL(file);
}

let THEMES_CATALOG = [...DEFAULT_THEMES];
try {
  const savedTh = JSON.parse(localStorage.getItem('sa_themes_catalog') || '[]');
  if (Array.isArray(savedTh) && savedTh.length > 0) {
    const existingIds = new Set(savedTh.map(t => t.id));
    const merged = [...savedTh];
    DEFAULT_THEMES.forEach(dt => {
      if (!existingIds.has(dt.id)) merged.unshift(dt);
    });
    THEMES_CATALOG = merged;
  }
} catch (e) {}

function saveThemesCatalog(){
  try { localStorage.setItem('sa_themes_catalog', JSON.stringify(THEMES_CATALOG)); } catch (e) {}
}

const VALID_GRADES = ['Năm 1', 'Năm 2', 'Năm 3', 'Năm 4'];
if (!S.grade || !VALID_GRADES.includes(S.grade)) {
  S.grade = 'Năm 1';
}
// Xác thực môn học thuộc 5 học phần cốt lõi HPU2
if (!S.subject || !HPU2_SUBJECTS.includes(S.subject)) {
  S.subject = 'Đại số tuyến tính';
}

// Cập nhật thương hiệu HPU2 nếu đang dùng cấu hình mặc định cũ
if (!S.cfg || S.cfg.siteName === 'Study Arena' || !S.cfg.siteTag || S.cfg.siteTag === 'Vườn Tri Thức') {
  S.cfg = Object.assign(S.cfg || {}, {
    siteName: 'HPU2 Study Arena',
    siteTag: 'ĐH Sư Phạm Hà Nội 2',
    siteSub: 'Đấu trường tri thức & nghiệp vụ Sư phạm Toán - HPU2',
    petId: S.cfg?.petId || 'hpu2_owl',
    petName: S.cfg?.petName || 'Cú Mèo HPU2',
    bgTheme: S.cfg?.bgTheme || 'hpu2_emerald',
    logoIcon: S.cfg?.logoIcon || '🏛️'
  });
}

// Khởi tạo và kiểm tra tính hợp lệ của Giao diện & Linh vật người dùng
if (!S.cfg.bgTheme || !THEMES_CATALOG.some(t => t.id === S.cfg.bgTheme)) {
  S.cfg.bgTheme = THEMES_CATALOG[0] ? THEMES_CATALOG[0].id : 'morning';
}
if (!S.cfg.petId || !PETS_CATALOG.some(p => p.id === S.cfg.petId)) {
  S.cfg.petId = PETS_CATALOG[0] ? PETS_CATALOG[0].id : 'mochi';
}
if (!S.cfg.petName) {
  const pFound = PETS_CATALOG.find(p => p.id === S.cfg.petId);
  S.cfg.petName = pFound ? pFound.name : 'Mochi';
}

const save=()=>{
  try{
    localStorage.setItem('mochi_garden',JSON.stringify(S));
    localStorage.setItem('mochi',JSON.stringify(S));
  }catch(e){}
};

const lvl=()=>Math.min(10,Math.floor((S.xp||0)/60)+1);

function toast(m){
  const t=$('#toast');if(!t)return;
  t.innerHTML=`<span>✨</span> <span>${m}</span>`;
  t.classList.remove('hidden');t.classList.add('flex');
  clearTimeout(toast.h);toast.h=setTimeout(()=>{t.classList.add('hidden');t.classList.remove('flex')},2500);
}

function gain(xp,k,d){
  const before=lvl();
  if(S.last!==TODAY()){
    const y=new Date(Date.now()-864e5).toDateString();
    S.streak=S.last===y?S.streak+1:1;S.last=TODAY();
  }
  S.xp=(S.xp||0)+xp;
  if(k&&S.st&&S.st[k]!==undefined) S.st[k]=Math.min(100,S.st[k]+d);
  save();
  Sound.drop();
  if(lvl()>before){
    Sound.tada();
    toast(`Chúc mừng! ${S.cfg.petName} đã Đột Phá Thăng Cấp ${lvl()}! 🎉`);
  }else{
    toast(`+${xp} Giọt sương tri thức (XP)`);
  }
  head();
}

/* ==================== 6. ÁP DỤNG THEME & HÌNH ẢNH GIAO DIỆN ==================== */
function applyGardenTheme(){
  const cfg=S.cfg||DEFAULT_CFG;
  const curP = PETS_CATALOG.find(p=>p.id===(cfg.petId||'mochi')) || PETS_CATALOG[0] || {name:'Mochi',icon:'🌱'};
  const petNick = cfg.petName || curP.name;
  
  const st=$('#siteTitle'),sg=$('#siteTag'),sb=$('#siteSub');
  if(st) st.textContent=cfg.siteName||'Study Arena';
  if(sg) sg.textContent=cfg.siteTag||'Vườn Tri Thức';
  if(sb) sb.textContent=cfg.siteSub||`Nuôi dưỡng linh vật ${petNick} qua từng bài học`;

  const lw=$('#siteLogoWrap'),li=$('#siteLogoIcon');
  if(lw&&li){
    if(cfg.customLogoUrl){
      lw.innerHTML=`<img src="${cfg.customLogoUrl}" class="w-full h-full object-cover">`;
    }else{
      lw.innerHTML=`<span id="siteLogoIcon">${cfg.logoIcon||'🌿'}</span>`;
    }
  }

  // Áp dụng hình nền: ưu tiên hình nền cá nhân của người dùng, nếu không tra cứu từ THEMES_CATALOG
  if(cfg.customBgUrl){
    document.body.style.background=`url('${cfg.customBgUrl}') center/cover fixed no-repeat`;
  } else {
    const curTheme = THEMES_CATALOG.find(t=>t.id===cfg.bgTheme) || THEMES_CATALOG[0];
    if(curTheme){
      if(curTheme.bgUrl){
        document.body.style.background=`url('${curTheme.bgUrl}') center/cover fixed no-repeat`;
      } else if(curTheme.style){
        document.body.style.background=curTheme.style;
      } else {
        document.body.style.background='linear-gradient(135deg, #e8f5e9 0%, #f1faee 50%, #e0f2fe 100%)';
      }
    } else {
      document.body.style.background='linear-gradient(135deg, #e8f5e9 0%, #f1faee 50%, #e0f2fe 100%)';
    }
  }
}

/* ==================== 7. ĐIỀU HƯỚNG & HEADER ==================== */
function head(){
  applyGardenTheme();

  const curP = PETS_CATALOG.find(p=>p.id===(S.cfg.petId||'mochi')) || PETS_CATALOG[0] || {name:'Mochi',icon:'🌱'};
  const petNick = S.cfg.petName || curP.name;

  // Navigation tabs
  const navEl=$('#nav');
  if(navEl){
    const tabs=[
      ['learn','🌱 Vườn Học Tập'],
      ['exam','⚔️ Đấu Trường Thi'],
      ['pet',`🏡 Nhà Cây ${petNick}`]
    ];
    if(S.tab==='admin'){
      tabs.push(['admin','⚙️ Quản Trị Viên']);
    }
    navEl.innerHTML=tabs.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  }

  // Chip trạng thái
  const chipEl=$('#chip');
  if(chipEl){
    chipEl.innerHTML=`
      <span class="inline-flex items-center gap-1 font-extrabold text-emerald-800">🪴 Cấp ${lvl()}</span>
      <span class="text-emerald-300">|</span>
      <span class="inline-flex items-center gap-1 font-bold text-amber-700">🔥 Chuỗi ${S.streak} ngày</span>
      <span class="text-emerald-300">|</span>
      <span class="inline-flex items-center gap-1 font-bold text-teal-700">💧 ${S.xp} Sương</span>
    `;
  }

  // Nút đăng nhập trực tiếp tại header
  const authEl=$('#auth');
  if(authEl){
    authEl.innerHTML=S.user?`
      <button class="btn sm outline max-w-[160px] sm:max-w-xs" onclick="toggleAuthDropdown()" title="Tài khoản: ${S.user.name}">
        <span class="truncate">👤 ${S.user.name}</span> <span class="text-[10px] shrink-0">▼</span>
      </button>
    `:`
      <button class="btn sm outline" onclick="toggleAuthDropdown()" title="Đăng nhập ngay tại đây">
        <span>👤 Đăng nhập</span> <span class="text-[10px]">▼</span>
      </button>
    `;
  }
}

function go(t){
  S.tab=t;save();render();
}

function render(){
  try{head()}catch(e){}
  const appEl=$('#app');
  if(appEl){
    try{
      if(S.tab==='admin') appEl.innerHTML=vAdminView();
      else appEl.innerHTML={learn:vLearn,exam:vExam,pet:vPet}[S.tab]();
    }catch(err){
      appEl.innerHTML=`<div class="card text-center p-6"><h3 class="font-bold text-rose-600">Đang phục hồi dữ liệu...</h3><button class="btn g sm mt-3" onclick="location.reload()">Làm Mới Trang</button></div>`;
    }
  }
}

function toggleAuthDropdown(){
  const d=$('#authDropdown');if(!d)return;
  const wrap=$('#authWrap');
  closeAdminPinDropdown();
  renderAuthDropdownContent();
  const willOpen=d.classList.contains('hidden');
  d.classList.toggle('hidden');
  if(wrap){
    if(willOpen) wrap.style.zIndex='1000';
    else wrap.style.zIndex='';
  }
  if(willOpen){
    setTimeout(()=>{
      const inp = S.user ? $('#editUserName') : $('#customUserName');
      if(inp) inp.focus();
    }, 50);
  }
}

function closeAuthDropdown(){
  const d=$('#authDropdown');if(d)d.classList.add('hidden');
  const wrap=$('#authWrap');if(wrap)wrap.style.zIndex='';
}

function quickLogin(p){
  S.user={name:p==='Khách Vãng Lai'?'Khách Yêu Vườn':`Học viên ${p}`,provider:p};
  save();closeAuthDropdown();
  toast('Đăng nhập thành công: '+S.user.name);head();
}

function loginWithName(){
  const inp=$('#customUserName');if(!inp)return;
  const name=inp.value.trim();
  if(!name){toast('Vui lòng nhập tên của bạn');return}
  S.user={name:name,provider:'Tùy chọn'};
  save();closeAuthDropdown();
  toast('Chào mừng '+name+' đến với Vườn Tri Thức!');head();
}

function renameUser(){
  const inp=$('#editUserName');if(!inp)return;
  const name=inp.value.trim();
  if(!name){toast('Tên không được để trống');return}
  if(!S.user)S.user={};
  S.user.name=name;save();closeAuthDropdown();
  toast('Đã cập nhật tên: '+name);head();
}

function logout(){
  S.user=null;save();closeAuthDropdown();
  toast('Đã đăng xuất');head();
}

function editAdminTheme(id){
  if(!checkAdminAuth()) return;
  const t = THEMES_CATALOG.find(x=>x.id===id);
  if(!t) return;
  const card = $('#adminThemeFormCard');if(!card)return;
  $('#editThemeId').value = t.id;
  $('#themeFormTitle').textContent = 'Chỉnh Sửa Giao Diện: ' + t.name;
  $('#themeFormName').value = t.name;
  $('#themeFormSlug').value = t.id;
  $('#themeFormDesc').value = t.desc || '';
  $('#themeFormStyle').value = t.style || '';

function uploadAdminThemeFile(files){
  if(!checkAdminAuth()) return;
  if(!files||!files[0]) return;
  fileToBase64(files[0], (dataUrl)=>{
    $('#themeFormBgUrl').value = dataUrl;
    toast('Đã nạp file ảnh nền vào form!');
  });
}

function saveAdminThemeSubmit(){
  if(!checkAdminAuth()) return;
  const editId = $('#editThemeId').value.trim();
  const name = $('#themeFormName').value.trim();
  let slug = $('#themeFormSlug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
  const desc = $('#themeFormDesc').value.trim();
  const style = $('#themeFormStyle').value.trim();
  const bgUrl = $('#themeFormBgUrl').value.trim();

  if(!name){ toast('Vui lòng nhập tên giao diện'); return; }
  if(!slug) slug = editId || ('theme_' + Date.now().toString(36));

  if(editId){
    const idx = THEMES_CATALOG.findIndex(x=>x.id===editId);
    if(idx!==-1){
      THEMES_CATALOG[idx] = { id: editId, name, desc, style, bgUrl };
      toast('Đã cập nhật giao diện: ' + name);
    }
  } else {
    if(THEMES_CATALOG.some(x=>x.id===slug)){
      slug = slug + '_' + Math.floor(Math.random()*1000);
    }
    THEMES_CATALOG.push({ id: slug, name, desc, style, bgUrl });
    toast('Đã thêm giao diện mới vào hệ thống: ' + name);
  }
  saveThemesCatalog();
  applyGardenTheme();
  render();
}

function deleteAdminTheme(id){
  if(!checkAdminAuth()) return;
  if(THEMES_CATALOG.length <= 1){
    toast('Không thể xóa giao diện duy nhất còn lại!');
    return;
  }
  const th = THEMES_CATALOG.find(x=>x.id===id);
  if(!confirm(`Xác nhận xóa giao diện "${th ? th.name : id}" khỏi toàn bộ hệ thống?`)) return;

  THEMES_CATALOG = THEMES_CATALOG.filter(x=>x.id!==id);
  if(S.cfg.bgTheme === id){
    S.cfg.bgTheme = THEMES_CATALOG[0].id;
    save();
  }
  saveThemesCatalog();
  applyGardenTheme();
  render();
  toast('Đã xóa giao diện khỏi hệ thống!');
}

function resetDefaultThemes(){
  if(!checkAdminAuth()) return;
  if(!confirm('Khôi phục danh sách giao diện mặc định ban đầu?')) return;
  THEMES_CATALOG = JSON.parse(JSON.stringify(DEFAULT_THEMES));
  saveThemesCatalog();
  applyGardenTheme();
  render();
  toast('Đã khôi phục danh mục giao diện gốc!');
}

function previewThemeLive(id){
  S.cfg = S.cfg || {};

  S.cfg.customBgUrl = '';
  save();
  applyGardenTheme();
  toast('Đang kích hoạt giao diện: ' + id);

    if(PETS_CATALOG.some(x=>x.id===slug)){
      slug = slug + '_' + Math.floor(Math.random()*1000);
    }
    PETS_CATALOG.push({ id: slug, name, title, icon, desc, avatarUrl });
    toast('Đã thêm linh vật mới vào kho chung: ' + name);
  }
  savePetsCatalog();
  render();
}

function deleteAdminPet(id){
  if(!checkAdminAuth()) return;
  if(PETS_CATALOG.length <= 1){
    toast('Không thể xóa linh vật duy nhất còn lại trong kho!');
    return;
  }
  const p = PETS_CATALOG.find(x=>x.id===id);
  if(!confirm(`Xác nhận xóa linh vật "${p ? p.name : id}" khỏi kho chung toàn hệ thống?`)) return;

  PETS_CATALOG = PETS_CATALOG.filter(x=>x.id!==id);
  if(S.cfg.petId === id){
    S.cfg.petId = PETS_CATALOG[0].id;
    save();
  }
  savePetsCatalog();
  render();
  toast('Đã xóa linh vật khỏi kho chung!');
}

const MODES=[
  ['day7','⚡ Cấp tốc (1 tuần: 7 ngày)'],
  ['week4','🚀 Nhanh (1 tháng: 4 tuần)'],
  ['week12','🌿 Chuẩn (3 tháng: 12 tuần)']
];

const tevery=()=>S.mode==='day7'?3:2;

const rng=i=>{
  const mode=S.mode||'week4';
  const D={day7:7,week4:28,week12:90}[mode]||28;
  const N={day7:7,week4:4,week12:12}[mode]||4;
  return [Math.round(i*D/N)+1, Math.round((i+1)*D/N)];
};
const hrsOf=i=>{
  const r=rng(i);
  return (S.hrs||2)*(r[1]-r[0]+1);
};
const lab=i=>{
  const[a,b]=rng(i);
  return (S.mode==='day7')?'Ngày '+(i+1):'Tuần '+(i+1)+' (Tháng '+(Math.floor((a-1)/30)+1)+', ngày '+a+'–'+b+')';

function upload(f){
  if(!f||!f.length)return;
  S.files=[...f].map(x=>x.name);
  const a=$('#aiStatus');
  if(a) a.innerHTML='<span class="inline-block animate-spin mr-1">🔄</span> AI đang đọc tài liệu và lọc kiến thức trọng tâm…';
  setTimeout(()=>{
    S.focus=[...CONTENT.KNOW];
    save();
    gain(20,'bp',12);
    toast('Đã phân tích tài liệu! Mochi hấp thu thêm dinh dưỡng');
    render();
  },1200);
}

function suggest(){
  const it=(S.focus&&S.focus.length)?S.focus:CONTENT.TOPICS;
  const modeMap={day7:7,week4:4,week12:12};
  const N=modeMap[S.mode]||4;
  S.plan=Array.from({length:N},(_,i)=>{
    const a=Math.floor(i*it.length/N),b=Math.floor((i+1)*it.length/N);
    return{
      t:b>a?it.slice(a,b).join('; '):'Tổng ôn chuyên đề & luyện đề củng cố phản xạ',
      d:i===0
    };
  });
  save();
  Sound.correct();
  toast('Đã cập nhật lộ trình học tập thông minh!');
  render();
}

function mv(i,d){
  const j=i+d;if(j<0||j>=S.plan.length)return;
  [S.plan[i],S.plan[j]]=[S.plan[j],S.plan[i]];
  save();render();
}

function doneWeek(i,v){
  if(S.plan&&S.plan[i]){
    S.plan[i].d=v;
    if(v){gain(25,'gn',8);Sound.correct();toast(`Xuất sắc! Hoàn thành ${lab(i)} 🎉`)}
    else save();
  }
}

function miniTest(){
  M={i:0,s:0,done:false,lock:false};

}

function exportDoc(){

function pick(i){
  const list=CONTENT.MCQ||[];

    if(k===q.a)b.classList.add('ok');

    M.s++;Sound.correct();gain(10,'kt',5);

    gain(3,'gn',1);

  const exBox=$('#exBox');
  if(exBox){
    exBox.innerHTML=`
      <div class="p-4 rounded-2xl ${isOk?'bg-teal-50 border border-teal-200 text-teal-950':'bg-rose-50 border border-rose-200 text-rose-950'}">
        <div class="font-extrabold text-sm flex items-center gap-1.5">

}

}

function vOral(){

  if(!list.length)return `<p class="text-center py-6 text-slate-500">Chưa có câu hỏi vấn đáp nào.</p>`;

function speakLastAI(){
  if(!('speechSynthesis' in window)){toast('Trình duyệt chưa hỗ trợ Text-to-Speech');return}
  try{
    const lastAi=[...O.log].reverse().find(m=>m.r==='ai');
    if(!lastAi)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(lastAi.t);
    u.lang='vi-VN';u.rate=0.95;
    window.speechSynthesis.speak(u);
  }catch(e){toast('Không thể phát âm: '+e.message)}
}

function micOral(){
  try{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast('Trình duyệt chưa hỗ trợ nhận diện giọng nói, em hãy gõ bàn phím nhé');return}
    const r=new SR();r.lang='vi-VN';
    toast('Đang lắng nghe câu trả lời…');
    r.onresult=e=>{
      const txt=e.results[0][0].transcript;
      const inp=$('#oaInput');if(inp)inp.value=txt;
      toast('Đã nhận: "'+txt+'"');
    };
    r.onerror=e=>{toast('Lỗi micro: '+(e.error||'không thể nhận diện'))};
    r.start();
  }catch(e){toast('Micro: '+e.message)}
}

function ansOral(){
  const el=$('#oaInput');if(!el)return;
  const v=el.value.trim();if(!v)return;
  O.log.push({r:'u',t:v});
  const list=CONTENT.ORAL||[];
  const q=list[O.i];
  if(!q){render();return}
  const hit=(q.k||[]).some(k=>v.toLowerCase().includes(k.toLowerCase()));

  if(hit||O.tries>=1){
    const reply=(hit?'Rất tốt! Tư duy và lập luận của em rất chuẩn xác. ':'Không sao, thầy/cô định hướng nhanh cho em: '+(q.hint||'')+' ')+
      (O.i+1<list.length?'Chúng ta đi sâu vào câu tiếp theo nhé: '+list[O.i+1].q:'Đó là câu hỏi cuối cùng. Chúc mừng em đã hoàn thành xuất sắc buổi vấn đáp nghiệp vụ HPU2!');
    O.log.push({r:'ai',t:reply});
    if(hit){gain(15,'vd',10);Sound.correct()}else{gain(5,'vd',4)}
    O.i++;O.tries=0;
    if(O.i>=list.length){O.over=true;S.done++;save()}
  }else{
    O.tries++;
    O.log.push({r:'ai',t:'Chưa đầy đủ ý sư phạm. '+(q.hint||'')+' Em hãy bổ sung thêm nhé.'});
  }
  render();
  setTimeout(()=>{const b=$('#chatBox');if(b)b.scrollTop=b.scrollHeight},50);
}

function mood(){
  const curP = PETS_CATALOG.find(p=>p.id===(S.cfg.petId||'mochi')) || PETS_CATALOG[0] || {name:'Mochi',icon:'🌱'};
  const petNick = S.cfg.petName || curP.name;
  const d=S.last?Math.floor((new Date(TODAY())-new Date(S.last))/864e5):null;
  if(d===0)return['😊',`${petNick} tự hào về bạn! Hôm nay bạn đã chăm sóc khu vườn chu đáo.`];
  if(d===null)return['🥰',`${petNick} mới đến với vườn. Hãy hoàn thành bài học để thắp sáng chuỗi ngày nhé!`];

  return['😠',`${petNick} giận rồi! Đã ${d} ngày bạn chưa ghé thăm vườn học.`];
}

function radar(){
  const L=['Kiến thức','Vấn đáp','Ghi nhớ','Độ bao phủ','Phản xạ'],K=['kt','vd','gn','bp','px'],c=110,R=78;
  const P=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[(c+r*Math.cos(a)).toFixed(1),(c+r*Math.sin(a)).toFixed(1)]};
  const poly=K.map((k,i)=>P(i,R*((S.st&&S.st[k])||20)/100).join(',')).join(' ');
  return `
  <svg viewBox="0 0 220 220" class="w-full max-w-[270px] mx-auto select-none" role="img" aria-label="Biểu đồ radar 5 chiều">
    ${[.33,.66,1].map(f=>`<polygon points="${K.map((k,i)=>P(i,R*f).join(',')).join(' ')}" fill="none" stroke="#b7e4c7" stroke-width="1.2" stroke-dasharray="${f===1?'none':'2,2'}"/>`).join('')}
    <polygon points="${poly}" fill="rgba(46,196,182,0.4)" stroke="#2ec4b6" stroke-width="2.5"/>
    ${K.map((k,i)=>{const[x,y]=P(i,R*((S.st&&S.st[k])||20)/100);return`<circle cx="${x}" cy="${y}" r="3.5" fill="#1b4332"/>`}).join('')}
    ${L.map((l,i)=>{const[x,y]=P(i,R+18);return`<text x="${x}" y="${y}" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0f382c">${l} (${(S.st&&S.st[K[i]])||0}%)</text>`}).join('')}
  </svg>
  `;
}

          <div class="mt-3 pt-2 border-t border-teal-200 flex items-center justify-between">
            <span class="text-xs font-semibold text-teal-900">Đang sử dụng ảnh riêng tùy chỉnh</span>
            <button class="btn sm rose !py-1 !px-2.5 text-xs" onclick="resetUserCustomPet()">Xóa Ảnh Riêng (Dùng Lại Ảnh Gốc Của Loài)</button>
          </div>
        ` : ''}
      </div>
    </section>

    <!-- KHỐI 2: TÙY CHỌN GIAO DIỆN (THEME / SKIN) -->
    <section class="card border-t-4 border-t-teal-600 shadow-sm">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-4 pb-3 border-b border-teal-100">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl">🎨</span>
          <div>
            <h3 class="font-extrabold text-lg text-emerald-950 font-fun">Giao Diện & Màu Sắc Trang Web</h3>
            <p class="text-xs text-emerald-700">Tự do đổi phông nền, màu sắc không gian học tập theo sở thích cá nhân (Lưu tự động)</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-teal-800">Đang dùng:</span>
          <span class="px-2.5 py-1 bg-teal-100 text-teal-900 rounded-full font-bold text-xs border border-teal-300">
            ${S.cfg.customBgUrl ? 'Ảnh nền cá nhân' : (curTheme.name||'Mặc định')}
          </span>
        </div>
      </div>

      <!-- KHO GIAO DIỆN HỆ THỐNG -->
      <div class="mb-5">
        <h4 class="font-extrabold text-sm text-emerald-950 uppercase tracking-wider mb-2.5 flex items-center justify-between">
          <span>Chọn Bộ Giao Diện Sẵn Có (${THEMES_CATALOG.length} chủ đề):</span>

        </h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          ${THEMES_CATALOG.map(t => {
            const isUsing = (S.cfg.bgTheme === t.id) && !S.cfg.customBgUrl;
            return `
              <div class="card p-3 border-2 transition cursor-pointer ${isUsing ? 'border-teal-600 bg-teal-50/90 shadow-md ring-2 ring-teal-400' : 'border-emerald-200/80 hover:border-teal-400 bg-white'}" onclick="setUserTheme('${t.id}')">
                <div class="w-full h-16 rounded-xl mb-2 border border-emerald-200 shadow-inner flex items-center justify-center font-bold text-xs" style="${t.bgUrl ? `background: url('${t.bgUrl}') center/cover no-repeat; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.8);` : (t.style ? `background: ${t.style};` : 'background: #e8f5e9;')}">
                  ${isUsing ? `<span class="bg-teal-900/80 text-white px-2 py-0.5 rounded-full text-[11px]">✓ Đang dùng</span>` : ''}

                <div class="flex items-center justify-between gap-1 mb-1">

        </div>
      </div>

      <!-- TẢI ẢNH NỀN RIÊNG -->
      <div class="p-3.5 bg-emerald-50/70 rounded-2xl border border-emerald-200">
        <h4 class="font-bold text-xs text-emerald-950 uppercase tracking-wider mb-2">🖼️ Hoặc Đặt Hình Nền Riêng Tùy Thích:</h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
          <div>
            <label class="text-[11px] font-semibold text-emerald-900 block mb-1">Cách 1: Chọn ảnh nền từ máy tính / điện thoại:</label>

              <span>📤 Tải Ảnh Nền Từ Máy (< 2MB)</span>
              <input type="file" accept="image/*" class="hidden" onchange="uploadUserCustomBg(this.files)">
            </label>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-emerald-900 block mb-1">Cách 2: Dán URL hình nền từ internet:</label>
            <div class="flex gap-1.5">
              <input id="userCustomBgUrl" 
                     placeholder="https://...hinh-nen.jpg" 
                     value="${S.cfg.customBgUrl||''}" 
                     class="text-xs font-mono py-1.5 px-2.5 flex-1">
              <button class="btn sm g shrink-0 !py-1.5 !px-3" onclick="applyUserCustomBgUrl()">Áp Dụng</button>
            </div>
          </div>
        </div>
        ${S.cfg.customBgUrl ? `
          <div class="mt-3 pt-2 border-t border-emerald-200 flex items-center justify-between">
            <span class="text-xs font-semibold text-emerald-900">Đang sử dụng hình nền riêng</span>
            <button class="btn sm rose !py-1 !px-2.5 text-xs" onclick="resetUserCustomBg()">Khôi Phục Giao Diện Mặc Định</button>
          </div>
        ` : ''}
      </div>
    </section>
  </div>
  `;
}

function setUserTheme(tId){
  S.cfg = S.cfg || {};
  S.cfg.bgTheme = tId;
  S.cfg.customBgUrl = '';
  save();
  applyGardenTheme();
  render();
  const th = THEMES_CATALOG.find(t=>t.id===tId);
  toast('Đã áp dụng giao diện: ' + (th ? th.name : tId));
}

function setUserPet(petId){
  S.cfg = S.cfg || {};
  S.cfg.petId = petId;
  const p = PETS_CATALOG.find(x=>x.id===petId);
  if(p && (!S.cfg.petName || DEFAULT_PETS.some(d=>d.name===S.cfg.petName))){
    S.cfg.petName = p.name;
  }
  save();
  render();
  toast('Đã chọn linh vật: ' + (p ? p.name : petId));
}

function uploadUserCustomBg(files){
  if(!files||!files[0]) return;
  fileToBase64(files[0], (dataUrl)=>{
    S.cfg = S.cfg || {};
    S.cfg.customBgUrl = dataUrl;
    save();
    applyGardenTheme();
    render();
    toast('Đã tải lên và áp dụng hình nền cá nhân!');
  });
}

function uploadUserCustomPet(files){
  if(!files||!files[0]) return;
  fileToBase64(files[0], (dataUrl)=>{
    S.cfg = S.cfg || {};
    S.cfg.customPetUrl = dataUrl;
    save();
    render();
    toast('Đã cập nhật ảnh linh vật cá nhân!');
  });
}

function applyUserCustomBgUrl(){
  const inp = $('#userCustomBgUrl');
  if(!inp) return;
  const url = inp.value.trim();
  if(!url){ toast('Vui lòng nhập đường link ảnh'); return; }
  S.cfg = S.cfg || {};
  S.cfg.customBgUrl = url;
  save();
  applyGardenTheme();
  render();
  toast('Đã áp dụng ảnh nền tùy chọn!');
}

function resetUserCustomBg(){
  S.cfg = S.cfg || {};
  S.cfg.customBgUrl = '';
  save();
  applyGardenTheme();
  render();
  toast('Đã khôi phục nền theo giao diện mặc định');
}

function applyUserCustomPetUrl(){
  const inp = $('#userCustomPetUrl');
  if(!inp) return;
  const url = inp.value.trim();
  if(!url){ toast('Vui lòng nhập link ảnh linh vật'); return; }
  S.cfg = S.cfg || {};
  S.cfg.customPetUrl = url;
  save();
  render();
  toast('Đã áp dụng ảnh linh vật tùy chọn!');
}

function resetUserCustomPet(){
  S.cfg = S.cfg || {};
  S.cfg.customPetUrl = '';
  save();
  render();
  toast('Đã chuyển về hình ảnh gốc của loài linh thú');
}

function saveUserPetName(){
  const inp = $('#userPetNameInput');
  if(!inp) return;
  const name = inp.value.trim();
  if(!name){ toast('Tên linh vật không được để trống'); return; }
  S.cfg = S.cfg || {};
  S.cfg.petName = name;
  save();
  render();
  toast('Đã lưu tên linh vật: ' + name);
}

  const curLvl=lvl();
  return `

      <h2 class="text-2xl font-extrabold text-emerald-950 font-fun mt-1">Lộ Trình Thăng Tiên Khu Vườn</h2>
      <p class="text-xs text-emerald-700 mt-1">Con đường tu luyện tri thức 10 cảnh giới từ Hạt Giống Phàm Thai đến Thần Mộc Độ Kiếp</p>
    </div>

    <div class="space-y-3 max-w-2xl mx-auto">

            <div class="flex items-start sm:items-center justify-between gap-3 flex-col sm:flex-row">

                  ${st.icon}
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${isCurrent?'bg-amber-500 text-white':isReached?'bg-emerald-600 text-white':'bg-slate-400 text-white'}">
                      Cảnh Giới ${st.lvl}: ${st.realm}
                    </span>
                    <span class="text-xs font-semibold text-slate-500">Yêu cầu: ${st.xp} XP</span>
                  </div>
                  <h3 class="font-extrabold text-emerald-950 text-base mt-1 font-fun">${st.name}</h3>
                  <p class="text-xs text-emerald-800 mt-0.5">${st.desc}</p>
                </div>
              </div>

              <div class="text-right sm:min-w-[140px] w-full sm:w-auto pt-2 sm:pt-0 border-t sm:border-0 border-slate-200">
                ${isCurrent?`
                  <span class="inline-block text-xs font-extrabold text-amber-700 bg-amber-100 px-3 py-1 rounded-full border border-amber-300">
                    ⚡ Đang Tu Luyện
                  </span>
                `:isReached?`
                  <span class="inline-block text-xs font-extrabold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full border border-emerald-300">
                    ✅ Đã Đắc Đạo
                  </span>
                `:`
                  <span class="inline-block text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">
                    🔒 Phong Ấn Mây Mù
                  </span>
                `}
                <div class="text-[11px] text-teal-700 font-semibold mt-1">🎁 ${st.reward}</div>
              </div>
            </div>
          </div>

          ${idx<ASCENSION_STAGES.length-1?`
            <div class="path-line"></div>
          `:''}
        `;
      }).join('')}
    </div>
  </section>
  `;
}

function waterPlant(){
  gain(10,'px',5);
  Sound.drop();
  const curP = PETS_CATALOG.find(p=>p.id===(S.cfg.petId||'mochi')) || PETS_CATALOG[0] || {name:'Mochi',icon:'🌱'};
  const petNick = S.cfg.petName || curP.name;
  toast(`Bạn đã tưới cho ${petNick} một giọt sương mát lành! 💧`);
  render();
}

function remind(){
  if(!('Notification' in window)){toast('Trình duyệt chưa hỗ trợ thông báo');return}
  const curP = PETS_CATALOG.find(p=>p.id===(S.cfg.petId||'mochi')) || PETS_CATALOG[0] || {name:'Mochi',icon:'🌱'};
  const petNick = S.cfg.petName || curP.name;
  try{
    Notification.requestPermission().then(p=>{
      if(p==='granted'){
        try{new Notification(`${petNick} nhắc bạn`,{body:'Đến giờ học rồi, khu vườn đang chờ!'})}catch(e){}
        toast('Đã bật nhắc nhở lúc '+S.remind);
      }else toast('Bạn chưa cho phép thông báo');
    }).catch(e=>{toast('Thông báo: '+e.message)});
  }catch(e){toast('Thông báo: '+e.message)}
}
setInterval(()=>{
  try{
    const n=new Date(),h=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    if(h===S.remind&&S.last!==TODAY()){
      const curP = PETS_CATALOG.find(p=>p.id===(S.cfg.petId||'mochi')) || PETS_CATALOG[0] || {name:'Mochi',icon:'🌱'};
      const petNick = S.cfg.petName || curP.name;
      toast(`Đến giờ học rồi, ${petNick} đang chờ!`);
      if('Notification' in window&&Notification.permission==='granted'){
        try{new Notification('Đến giờ học rồi!',{body:`${petNick} đang chờ em học bài.`})}catch(e){}
      }
    }
  }catch(e){}
},30000);

/* ==================== 14. HIỆU ỨNG LÁ BAY KHU VƯỜN (CANVAS) ==================== */
function setupGardenCanvas(){
  const cv=document.getElementById('leafCanvas');
  if(!cv)return;
  const cx=cv.getContext('2d');
  let W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;
  window.addEventListener('resize',()=>{W=cv.width=window.innerWidth;H=cv.height=window.innerHeight});
  const leaves=Array.from({length:20},()=>({
    x:Math.random()*W,y:Math.random()*H,sz:Math.random()*12+8,
    vx:Math.random()*0.8-0.2,vy:Math.random()*0.8+0.4,
    ang:Math.random()*Math.PI*2,va:Math.random()*0.02-0.01,
    c:['rgba(82,183,136,0.3)','rgba(46,196,182,0.25)','rgba(255,183,3,0.25)','rgba(116,198,157,0.3)'][Math.floor(Math.random()*4)]
  }));
  function loop(){
    cx.clearRect(0,0,W,H);
    for(const l of leaves){
      l.x+=l.vx;l.y+=l.vy;l.ang+=l.va;
      if(l.y>H+20){l.y=-20;l.x=Math.random()*W}
      if(l.x>W+20)l.x=-20;if(l.x<-20)l.x=W+20;
      cx.save();cx.translate(l.x,l.y);cx.rotate(l.ang);
      cx.fillStyle=l.c;cx.beginPath();
      cx.ellipse(0,0,l.sz,l.sz*0.5,0,0,Math.PI*2);cx.fill();
      cx.restore();
    }
    requestAnimationFrame(loop);
  }
  loop();
}

/* ==================== 15. KHỞI CHẠY ==================== */
setupGardenCanvas();
render();
</script>
