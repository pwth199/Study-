<style>
:root{

body{

h1,h2,h3,.font-fun{font-family:'Quicksand',sans-serif}
.card{

.btn{

  border-radius:14px;
  padding:10px 18px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 4px 12px rgba(45,106,79,0.2);
  transition:all .2s ease;
  cursor:pointer;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(45,106,79,0.3);background:linear-gradient(135deg,#40916c,#2d6a4f)}

@keyframes floatGarden{

/* POPUP DROPDOWN TRÊN CÙNG (ĐÈ LÊN GIAO DIỆN MỘT CÁCH GỌN GÀNG, KHÔNG BỊ CHE KHUẤT) */
.popup-dropdown {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: 320px;
  max-width: min(340px, calc(100vw - 32px));
  background: #ffffff;
  border-radius: 20px;
  padding: 16px 18px;
  box-shadow: 0 20px 45px -10px rgba(15, 56, 44, 0.28), 0 4px 16px rgba(15, 56, 44, 0.08);
  z-index: 9999;
  animation: fadeInDown 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.popup-dropdown.admin-dropdown {
  border: 2px solid #fcd34d;
}
.popup-dropdown.auth-dropdown {
  border: 2px solid #6ee7b7;
}
.popup-dropdown::before {
  content: '';
  position: absolute;
  top: -7px;
  right: 24px;
  width: 12px;
  height: 12px;
  background: #ffffff;
  transform: rotate(45deg);
  border-top: 2px solid;
  border-left: 2px solid;
  border-color: inherit;
  z-index: 10000;
}
@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.admin-badge{

function fileToBase64(file, callback){
  if(!file)return;
  if(file.size > 2 * 1024 * 1024){
    toast('Ảnh quá lớn (vui lòng chọn ảnh dưới 2MB)');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => callback(e.target.result);
  reader.readAsDataURL(file);
}

/* ==================== 3. ÂM THANH WEBAUDIO (OFFLINE) ==================== */
const Sound={
  ctx:null,
  init(){
    if(!this.ctx){
      try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
    }
    if(this.ctx&&this.ctx.state==='suspended'){
      try{this.ctx.resume()}catch(e){}
    }
  },
  drop(){
    if(!S||S.muted)return;this.init();
    try{
      if(!this.ctx)return;
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(500,this.ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1200,this.ctx.currentTime+0.12);
      g.gain.setValueAtTime(0.25,this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.12);
      o.connect(g);g.connect(this.ctx.destination);
      o.start();o.stop(this.ctx.currentTime+0.12);
    }catch(e){}
  },
  correct(){
    if(!S||S.muted)return;this.init();
    try{
      if(!this.ctx)return;
      [523.25,659.25,783.99].forEach((f,i)=>{
        const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.type='triangle';o.frequency.setValueAtTime(f,this.ctx.currentTime+i*0.08);
        g.gain.setValueAtTime(0.2,this.ctx.currentTime+i*0.08);
        g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+i*0.08+0.25);
        o.connect(g);g.connect(this.ctx.destination);
        o.start(this.ctx.currentTime+i*0.08);o.stop(this.ctx.currentTime+i*0.08+0.25);
      });
    }catch(e){}
  },
  tada(){
    if(!S||S.muted)return;this.init();
    try{
      if(!this.ctx)return;
      [440,554.37,659.25,880].forEach((f,i)=>{
        const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.type='sine';o.frequency.setValueAtTime(f,this.ctx.currentTime+i*0.1);
        g.gain.setValueAtTime(0.3,this.ctx.currentTime+i*0.1);
        g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+i*0.1+0.4);
        o.connect(g);g.connect(this.ctx.destination);
        o.start(this.ctx.currentTime+i*0.1);o.stop(this.ctx.currentTime+i*0.1+0.4);
      });
    }catch(e){}
  }
};

function editAdminTheme(id){
  if(!checkAdminAuth()) return;
  const t = THEMES_CATALOG.find(x=>x.id===id);
  if(!t) return;
  const card = $('#adminThemeFormCard');if(!card)return;
  $('#editThemeId').value = t.id;
  $('#themeFormTitle').textContent = 'Chỉnh Sửa Giao Diện: ' + t.name;
  $('#themeFormName').value = t.name;
  $('#themeFormSlug').value = t.id;
  $('#themeFormDesc').value = t.desc || '';
  $('#themeFormStyle').value = t.style || '';
  $('#themeFormBgUrl').value = t.bgUrl || '';
  card.classList.remove('hidden');
  $('#themeFormName').focus();
}

function uploadAdminThemeFile(files){
  if(!checkAdminAuth()) return;
  if(!files||!files[0]) return;
  fileToBase64(files[0], (dataUrl)=>{
    $('#themeFormBgUrl').value = dataUrl;
    toast('Đã nạp file ảnh nền vào form!');
  });
}

function saveAdminThemeSubmit(){
  if(!checkAdminAuth()) return;
  const editId = $('#editThemeId').value.trim();
  const name = $('#themeFormName').value.trim();
  let slug = $('#themeFormSlug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
  const desc = $('#themeFormDesc').value.trim();
  const style = $('#themeFormStyle').value.trim();
  const bgUrl = $('#themeFormBgUrl').value.trim();

  if(!name){ toast('Vui lòng nhập tên giao diện'); return; }
  if(!slug) slug = editId || ('theme_' + Date.now().toString(36));

  if(editId){
    const idx = THEMES_CATALOG.findIndex(x=>x.id===editId);
    if(idx!==-1){
      THEMES_CATALOG[idx] = { id: editId, name, desc, style, bgUrl };
      toast('Đã cập nhật giao diện: ' + name);
    }
  } else {
    if(THEMES_CATALOG.some(x=>x.id===slug)){
      slug = slug + '_' + Math.floor(Math.random()*1000);
    }
    THEMES_CATALOG.push({ id: slug, name, desc, style, bgUrl });
    toast('Đã thêm giao diện mới vào hệ thống: ' + name);
  }
  saveThemesCatalog();
  applyGardenTheme();
  render();
}

function deleteAdminTheme(id){
  if(!checkAdminAuth()) return;
  if(THEMES_CATALOG.length <= 1){
    toast('Không thể xóa giao diện duy nhất còn lại!');
    return;
  }
  const th = THEMES_CATALOG.find(x=>x.id===id);
  if(!confirm(`Xác nhận xóa giao diện "${th ? th.name : id}" khỏi toàn bộ hệ thống?`)) return;

  THEMES_CATALOG = THEMES_CATALOG.filter(x=>x.id!==id);
  if(S.cfg.bgTheme === id){
    S.cfg.bgTheme = THEMES_CATALOG[0].id;
    save();
  }
  saveThemesCatalog();
  applyGardenTheme();
  render();
  toast('Đã xóa giao diện khỏi hệ thống!');
}

function resetDefaultThemes(){
  if(!checkAdminAuth()) return;
  if(!confirm('Khôi phục danh sách giao diện mặc định ban đầu?')) return;
  THEMES_CATALOG = JSON.parse(JSON.stringify(DEFAULT_THEMES));
  saveThemesCatalog();
  applyGardenTheme();
  render();
  toast('Đã khôi phục danh mục giao diện gốc!');
}

function previewThemeLive(id){
  S.cfg = S.cfg || {};
  S.cfg.bgTheme = id;
  S.cfg.customBgUrl = '';
  save();
  applyGardenTheme();
  toast('Đang kích hoạt giao diện: ' + id);
  render();

function showAddPetModal(){
  if(!checkAdminAuth()) return;
  const card = $('#adminPetFormCard');if(!card)return;
  $('#editPetId').value = '';
  $('#adminPetFormTitle').textContent = 'Thêm Linh Vật Mới Vào Kho';
  $('#petFormName').value = '';
  $('#petFormSlug').value = '';
  $('#petFormTitle').value = '';
  $('#petFormIcon').value = '🐾';
  $('#petFormDesc').value = '';
  $('#petFormAvatarUrl').value = '';
  $('#petFormAvatarPreview').innerHTML = '';
  card.classList.remove('hidden');
  $('#petFormName').focus();
}

function editAdminPet(id){
  if(!checkAdminAuth()) return;
  const p = PETS_CATALOG.find(x=>x.id===id);
  if(!p) return;
  const card = $('#adminPetFormCard');if(!card)return;
  $('#editPetId').value = p.id;
  $('#adminPetFormTitle').textContent = 'Chỉnh Sửa Linh Vật: ' + p.name;
  $('#petFormName').value = p.name;
  $('#petFormSlug').value = p.id;
  $('#petFormTitle').value = p.title || '';
  $('#petFormIcon').value = p.icon || '🐾';
  $('#petFormDesc').value = p.desc || '';
  $('#petFormAvatarUrl').value = p.avatarUrl || '';
  if(p.avatarUrl){
    $('#petFormAvatarPreview').innerHTML = `<img src="${p.avatarUrl}" class="w-12 h-12 object-cover rounded-xl mt-1 border border-emerald-300">`;
  } else {
    $('#petFormAvatarPreview').innerHTML = '';
  }
  card.classList.remove('hidden');
  $('#petFormName').focus();
}

function uploadAdminPetFile(files){
  if(!checkAdminAuth()) return;
  if(!files||!files[0]) return;
  fileToBase64(files[0], (dataUrl)=>{
    $('#petFormAvatarUrl').value = dataUrl;
    $('#petFormAvatarPreview').innerHTML = `<img src="${dataUrl}" class="w-12 h-12 object-cover rounded-xl mt-1 border border-emerald-300">`;
    toast('Đã tải ảnh linh vật lên thành công!');
  });
}

function saveAdminPetSubmit(){
  if(!checkAdminAuth()) return;
  const editId = $('#editPetId').value.trim();
  const name = $('#petFormName').value.trim();
  let slug = $('#petFormSlug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
  const title = $('#petFormTitle').value.trim() || 'Linh Thú Tri Thức';
  const icon = $('#petFormIcon').value.trim() || '🐾';
  const desc = $('#petFormDesc').value.trim();
  const avatarUrl = $('#petFormAvatarUrl').value.trim();

  if(!name){ toast('Vui lòng nhập tên loài / linh vật'); return; }
  if(!slug) slug = editId || ('pet_' + Date.now().toString(36));

  if(editId){
    const idx = PETS_CATALOG.findIndex(x=>x.id===editId);
    if(idx!==-1){
      PETS_CATALOG[idx] = { id: editId, name, title, icon, desc, avatarUrl };
      toast('Đã cập nhật thông tin linh vật: ' + name);
    }
  } else {
    if(PETS_CATALOG.some(x=>x.id===slug)){
      slug = slug + '_' + Math.floor(Math.random()*1000);
    }
    PETS_CATALOG.push({ id: slug, name, title, icon, desc, avatarUrl });
    toast('Đã thêm linh vật mới vào kho chung: ' + name);
  }
  savePetsCatalog();
  render();
}

function deleteAdminPet(id){
  if(!checkAdminAuth()) return;
  if(PETS_CATALOG.length <= 1){
    toast('Không thể xóa linh vật duy nhất còn lại trong kho!');
    return;
  }
  const p = PETS_CATALOG.find(x=>x.id===id);
  if(!confirm(`Xác nhận xóa linh vật "${p ? p.name : id}" khỏi kho chung toàn hệ thống?`)) return;

  PETS_CATALOG = PETS_CATALOG.filter(x=>x.id!==id);
  if(S.cfg.petId === id){
    S.cfg.petId = PETS_CATALOG[0].id;
    save();
  }
  savePetsCatalog();
  render();
  toast('Đã xóa linh vật khỏi kho chung!');
}

function resetDefaultPets(){
  if(!checkAdminAuth()) return;
  if(!confirm('Khôi phục kho linh vật mặc định ban đầu?')) return;
  PETS_CATALOG = JSON.parse(JSON.stringify(DEFAULT_PETS));
  savePetsCatalog();
  render();
  toast('Đã khôi phục kho linh thú gốc!');
}

function previewPetLive(id){
  S.cfg = S.cfg || {};
  S.cfg.petId = id;
  S.cfg.customPetUrl = '';
  save();
  render();
  toast('Đang xem linh thú: ' + id);
}
  applyGardenTheme();

  render();
}

function exportJsonBackup(){

function importJsonBackup(files){
  if(!files.length)return;
  const r=new FileReader();
  r.onload=e=>{
    try{

      render();
    }catch(err){toast('File JSON không hợp lệ')}
  };
  r.readAsText(files[0]);
}
function exportStandaloneHtml(){
  const fullHtml=document.documentElement.outerHTML;
  const b=new Blob(['<!doctype html>\n'+fullHtml],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='STUDY-ARENA-HOAN-CHINH.html';a.click();

const MODES=[

];
const unit=()=>S.mode==='day7'?'Ngày':'Tuần';
const tevery=()=>S.mode==='day7'?3:2;

const rng=i=>{
  const mode=S.mode||'week4';
  const D={day7:7,week4:28,week12:90}[mode]||28;
  const N={day7:7,week4:4,week12:12}[mode]||4;
  return [Math.round(i*D/N)+1, Math.round((i+1)*D/N)];
};
const hrsOf=i=>{
  const r=rng(i);
  return (S.hrs||2)*(r[1]-r[0]+1);
};
const lab=i=>{
  const[a,b]=rng(i);
  return (S.mode==='day7')?'Ngày '+(i+1):'Tuần '+(i+1)+' (Tháng '+(Math.floor((a-1)/30)+1)+', ngày '+a+'–'+b+')';
};

function suggest(){
  const it=(S.focus&&S.focus.length)?S.focus:CONTENT.TOPICS;
  const modeMap={day7:7,week4:4,week12:12};
  const N=modeMap[S.mode]||4;
  S.plan=Array.from({length:N},(_,i)=>{
    const a=Math.floor(i*it.length/N),b=Math.floor((i+1)*it.length/N);
    return{
      t:b>a?it.slice(a,b).join('; '):'Tổng ôn chuyên đề & luyện đề củng cố phản xạ',
      d:i===0
    };
  });
  save();
  Sound.correct();
  toast('Đã cập nhật lộ trình học tập thông minh!');
  render();
}

function mv(i,d){
  const j=i+d;if(j<0||j>=S.plan.length)return;
  [S.plan[i],S.plan[j]]=[S.plan[j],S.plan[i]];
  save();render();
}

function doneWeek(i,v){
  if(S.plan&&S.plan[i]){

    if(v){gain(25,'gn',8);Sound.correct();toast(`Xuất sắc! Hoàn thành ${lab(i)} 🎉`)}

  }
}

function speakLastAI(){
  if(!('speechSynthesis' in window)){toast('Trình duyệt chưa hỗ trợ Text-to-Speech');return}
  try{
    const lastAi=[...O.log].reverse().find(m=>m.r==='ai');
    if(!lastAi)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(lastAi.t);
    u.lang='vi-VN';u.rate=0.95;
    window.speechSynthesis.speak(u);
  }catch(e){toast('Không thể phát âm: '+e.message)}
}

function micOral(){
  try{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast('Trình duyệt chưa hỗ trợ nhận diện giọng nói, em hãy gõ bàn phím nhé');return}
    const r=new SR();r.lang='vi-VN';
    toast('Đang lắng nghe câu trả lời…');
    r.onresult=e=>{
      const txt=e.results[0][0].transcript;
      const inp=$('#oaInput');if(inp)inp.value=txt;
      toast('Đã nhận: "'+txt+'"');
    };
    r.onerror=e=>{toast('Lỗi micro: '+(e.error||'không thể nhận diện'))};
    r.start();
  }catch(e){toast('Micro: '+e.message)}
}

function ansOral(){
  const el=$('#oaInput');if(!el)return;
  const v=el.value.trim();if(!v)return;
  O.log.push({r:'u',t:v});
  const list=CONTENT.ORAL||[];
  const q=list[O.i];
  if(!q){render();return}
  const hit=(q.k||[]).some(k=>v.toLowerCase().includes(k.toLowerCase()));

  if(hit||O.tries>=1){
    const reply=(hit?'Tốt, ý của em đúng hướng. ':'Không sao, thầy giải thích nhanh: '+(q.hint||'')+' ')+
      (O.i+1<list.length?'Đi sâu hơn nhé: '+list[O.i+1].q:'Đó là câu cuối. Em đã hoàn thành buổi vấn đáp!');
    O.log.push({r:'ai',t:reply});
    if(hit){gain(15,'vd',10);Sound.correct()}else{gain(5,'vd',4)}
    O.i++;O.tries=0;
    if(O.i>=list.length){O.over=true;S.done++;save()}
  }else{
    O.tries++;
    O.log.push({r:'ai',t:'Chưa đủ ý. '+(q.hint||'')+' Em thử lại nhé.'});
  }
  render();
  setTimeout(()=>{const b=$('#chatBox');if(b)b.scrollTop=b.scrollHeight},50);
}

function radar(){
  const L=['Kiến thức','Vấn đáp','Ghi nhớ','Độ bao phủ','Phản xạ'],K=['kt','vd','gn','bp','px'],c=110,R=78;
  const P=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[(c+r*Math.cos(a)).toFixed(1),(c+r*Math.sin(a)).toFixed(1)]};
  const poly=K.map((k,i)=>P(i,R*((S.st&&S.st[k])||20)/100).join(',')).join(' ');
  return `
  <svg viewBox="0 0 220 220" class="w-full max-w-[270px] mx-auto select-none" role="img" aria-label="Biểu đồ radar 5 chiều">
    ${[.33,.66,1].map(f=>`<polygon points="${K.map((k,i)=>P(i,R*f).join(',')).join(' ')}" fill="none" stroke="#b7e4c7" stroke-width="1.2" stroke-dasharray="${f===1?'none':'2,2'}"/>`).join('')}
    <polygon points="${poly}" fill="rgba(46,196,182,0.4)" stroke="#2ec4b6" stroke-width="2.5"/>
    ${K.map((k,i)=>{const[x,y]=P(i,R*((S.st&&S.st[k])||20)/100);return`<circle cx="${x}" cy="${y}" r="3.5" fill="#1b4332"/>`}).join('')}
    ${L.map((l,i)=>{const[x,y]=P(i,R+18);return`<text x="${x}" y="${y}" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0f382c">${l} (${(S.st&&S.st[K[i]])||0}%)</text>`}).join('')}
  </svg>
  `;
}

function setUserTheme(tId){

  applyGardenTheme();
  render();
  const th = THEMES_CATALOG.find(t=>t.id===tId);
  toast('Đã áp dụng giao diện: ' + (th ? th.name : tId));
}

function setUserPet(petId){
  S.cfg = S.cfg || {};
  S.cfg.petId = petId;
  const p = PETS_CATALOG.find(x=>x.id===petId);
  if(p && (!S.cfg.petName || DEFAULT_PETS.some(d=>d.name===S.cfg.petName))){
    S.cfg.petName = p.name;
  }
  save();
  render();
  toast('Đã chọn linh vật: ' + (p ? p.name : petId));
}

function uploadUserCustomBg(files){
  if(!files||!files[0]) return;
  fileToBase64(files[0], (dataUrl)=>{
    S.cfg = S.cfg || {};
    S.cfg.customBgUrl = dataUrl;
    save();
    applyGardenTheme();
    render();
    toast('Đã tải lên và áp dụng hình nền cá nhân!');
  });
}

  const curP = PETS_CATALOG.find(p=>p.id===(S.cfg.petId||'mochi')) || PETS_CATALOG[0] || {name:'Mochi',icon:'🌱'};
  const petNick = S.cfg.petName || curP.name;
  try{
    Notification.requestPermission().then(p=>{
      if(p==='granted'){
        try{new Notification(`${petNick} nhắc bạn`,{body:'Đến giờ học rồi, khu vườn đang chờ!'})}catch(e){}
        toast('Đã bật nhắc nhở lúc '+S.remind);
      }else toast('Bạn chưa cho phép thông báo');
    }).catch(e=>{toast('Thông báo: '+e.message)});
  }catch(e){toast('Thông báo: '+e.message)}
}
setInterval(()=>{
  try{
    const n=new Date(),h=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    if(h===S.remind&&S.last!==TODAY()){
      const curP = PETS_CATALOG.find(p=>p.id===(S.cfg.petId||'mochi')) || PETS_CATALOG[0] || {name:'Mochi',icon:'🌱'};
      const petNick = S.cfg.petName || curP.name;
      toast(`Đến giờ học rồi, ${petNick} đang chờ!`);
      if('Notification' in window&&Notification.permission==='granted'){
        try{new Notification('Đến giờ học rồi!',{body:`${petNick} đang chờ em học bài.`})}catch(e){}
      }
    }
  }catch(e){}
},30000);

/* ==================== 14. HIỆU ỨNG LÁ BAY KHU VƯỜN (CANVAS) ==================== */
function setupGardenCanvas(){
  const cv=document.getElementById('leafCanvas');
  if(!cv)return;
  const cx=cv.getContext('2d');
  let W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;
  window.addEventListener('resize',()=>{W=cv.width=window.innerWidth;H=cv.height=window.innerHeight});
  const leaves=Array.from({length:20},()=>({
    x:Math.random()*W,y:Math.random()*H,sz:Math.random()*12+8,
    vx:Math.random()*0.8-0.2,vy:Math.random()*0.8+0.4,
    ang:Math.random()*Math.PI*2,va:Math.random()*0.02-0.01,
    c:['rgba(82,183,136,0.3)','rgba(46,196,182,0.25)','rgba(255,183,3,0.25)','rgba(116,198,157,0.3)'][Math.floor(Math.random()*4)]
  }));
  function loop(){
    cx.clearRect(0,0,W,H);
    for(const l of leaves){
      l.x+=l.vx;l.y+=l.vy;l.ang+=l.va;
      if(l.y>H+20){l.y=-20;l.x=Math.random()*W}
      if(l.x>W+20)l.x=-20;if(l.x<-20)l.x=W+20;
      cx.save();cx.translate(l.x,l.y);cx.rotate(l.ang);
      cx.fillStyle=l.c;cx.beginPath();
      cx.ellipse(0,0,l.sz,l.sz*0.5,0,0,Math.PI*2);cx.fill();
      cx.restore();
    }
    requestAnimationFrame(loop);
  }
  loop();
}

/* ==================== 15. KHỞI CHẠY ==================== */
setupGardenCanvas();
render();
</script>
