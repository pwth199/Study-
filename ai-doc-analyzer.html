<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phân tích tài liệu bằng AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#16213a;--mute:#5b6784;--line:#d9e0ec;--brand:#2742c4;--brand-ink:#fff;--hl:#ffd84d;--ok:#13795b;--okbg:#e2f5ee;--bad:#b3261e;--badbg:#fdeceb;--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--card:#172038;--ink:#e8ecf7;--mute:#9aa6c4;--line:#2a3558;--brand:#8ea2ff;--brand-ink:#0e1424;--hl:#e2b900;--ok:#5fd3ae;--okbg:#10332a;--bad:#ff8b84;--badbg:#3a1a19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Be Vietnam Pro",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:1.75rem;line-height:1.25;margin:0 0 6px}
h2{font-size:1.25rem;margin:0 0 14px}
h3{font-size:1.02rem;margin:0 0 4px}
p{margin:0 0 10px}
.sub{color:var(--mute);margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:30px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,transparent)}
.drop:focus-visible,button:focus-visible,input:focus-visible+label{outline:3px solid var(--brand);outline-offset:2px}
.drop strong{display:block;margin-bottom:2px}
.drop small,.mute{color:var(--mute)}
#fname{margin-top:10px;font-weight:600;word-break:break-all}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:600;border-radius:9px;padding:10px 18px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button:disabled{opacity:.5;cursor:not-allowed}
.err{background:var(--badbg);color:var(--bad);border-radius:9px;padding:10px 14px;margin-top:14px}
.hidden{display:none!important}
/* loading */
.loading{text-align:center;padding:36px 10px}
.spin{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--brand);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;max-width:280px;margin:14px auto 0}
.bar i{display:block;height:100%;width:40%;background:var(--hl);animation:sl 1.4s ease-in-out infinite}
@keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.spin,.bar i{animation-duration:3s}}
/* results */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tabs button{border-radius:999px;padding:7px 16px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pt{padding:12px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.formula{background:color-mix(in srgb,var(--hl) 22%,transparent);border-left:4px solid var(--hl);padding:12px 14px;border-radius:6px;margin:10px 0;overflow-x:auto}
.formula .tex{font-size:1.1rem;padding:4px 0}
.badge{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--line)}
.badge.cao{background:var(--badbg);color:var(--bad)}.badge.tb{background:color-mix(in srgb,var(--hl) 40%,transparent)}.badge.thap{background:var(--okbg);color:var(--ok)}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.opt:disabled{opacity:1;cursor:default}
.expl{background:var(--bg);border-radius:8px;padding:10px 14px;margin-top:8px}
details{margin-top:8px}summary{cursor:pointer;font-weight:600;color:var(--brand)}
.score{font-size:1.2rem;font-weight:700}
.saved li{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);list-style:none}
.saved ul{padding:0;margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;z-index:20}
.key-box{margin-top:12px;padding:10px;background:color-mix(in srgb,var(--brand) 6%,transparent);border:1px dashed var(--line);border-radius:8px;display:flex;gap:8px;align-items:center;font-size:0.85rem}
.key-box input{flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--card);color:var(--ink)}
.key-box button{padding:6px 12px;font-size:0.85rem}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--mute);text-decoration:none;font-weight:600;margin-bottom:14px;font-size:0.9rem}
.back-link:hover{color:var(--brand)}
</style>
</head>
<body>
<main class="wrap">
  <a href="index.html" class="back-link">← Trở về Study Arena</a>
  <h1>Phân tích tài liệu bằng AI</h1>
  <p class="sub">Tải lên PDF, Word (.docx) hoặc .txt để nhận tóm tắt, câu hỏi ôn tập và gợi ý hướng ôn.</p>

  <section class="card" id="uploadCard">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Chọn tệp tài liệu">
      <strong>Kéo thả tệp vào đây hoặc bấm để chọn</strong>
      <small>PDF, DOCX, TXT · tối đa 15 MB</small>
      <div id="fname"></div>
    </div>
    <input type="file" id="file" accept=".pdf,.docx,.txt,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="hidden">
    
    <div class="key-box">
      <span>🔑 Gemini API Key:</span>
      <input type="password" id="apiKeyInput" placeholder="Dán Gemini API Key (tự động lưu vào trình duyệt của bạn)...">
      <button id="saveKeyBtn">Lưu Key</button>
    </div>

    <div class="row">
      <button class="primary" id="go" disabled>Phân tích tài liệu</button>
      <button id="showSaved">Bộ ôn tập đã lưu</button>
    </div>
    <div id="err" class="err hidden" role="alert"></div>
  </section>

  <section class="card saved hidden" id="savedCard"><h2>Bộ ôn tập đã lưu</h2><ul id="savedList"></ul></section>

  <section class="card loading hidden" id="loading" aria-live="polite">
    <div class="spin"></div>
    <strong>Đang phân tích tài liệu...</strong>
    <p class="mute" id="loadMsg">AI đang đọc nội dung</p>
    <div class="bar"><i></i></div>
  </section>

  <section id="result" class="hidden">
    <div class="tabs" role="tablist">
      <button role="tab" data-t="sum" aria-selected="true">Tóm tắt</button>
      <button role="tab" data-t="quiz" aria-selected="false">Làm trắc nghiệm</button>
      <button role="tab" data-t="essay" aria-selected="false">Tự luận</button>
      <button role="tab" data-t="plan" aria-selected="false">Hướng ôn tập</button>
    </div>
    <div id="p-sum"></div><div id="p-quiz" class="hidden"></div><div id="p-essay" class="hidden"></div><div id="p-plan" class="hidden"></div>
    <div class="row">
      <button class="primary" id="save">Lưu bộ ôn tập</button>
      <button id="dl">Tải về (.json)</button>
      <button id="again">Phân tích tài liệu khác</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
/* ============ CẤU HÌNH ============
   CÁCH AN TOÀN (khuyên dùng): đặt PROXY_URL trỏ tới server của bạn. Server giữ GEMINI_API_KEY
   và chuyển tiếp body JSON tới Gemini (xem ví dụ Node.js trong phần hướng dẫn).
   CÁCH NHANH (chỉ để thử): điền GEMINI_API_KEY hoặc nhập trực tiếp trên giao diện — lưu ở localStorage. */
const CONFIG = {
  PROXY_URL: "",                       // ví dụ: "/api/analyze"
  GEMINI_API_KEY: localStorage.getItem("study_arena_gemini_key") || "", // lấy từ localStorage nếu có
  MODEL: "gemini-2.5-flash",
  MAX_BYTES: 15 * 1024 * 1024,
  MAX_CHARS: 120000
};

const $ = id => document.getElementById(id);
let file = null, data = null, quizState = [];
const STORE = "docAnalysis.saved.v1";

// Cấu hình API key từ UI
const apiKeyInput = $("apiKeyInput");
if (apiKeyInput && CONFIG.GEMINI_API_KEY) {
  apiKeyInput.value = CONFIG.GEMINI_API_KEY;
}
$("saveKeyBtn").onclick = () => {
  const k = (apiKeyInput.value || "").trim();
  CONFIG.GEMINI_API_KEY = k;
  localStorage.setItem("study_arena_gemini_key", k);
  toast(k ? "Đã lưu Gemini API Key!" : "Đã xóa API Key");
};

/* ---------- tiện ích ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function showErr(m){const e=$("err");e.textContent=m;e.classList.toggle("hidden",!m)}
function typeset(el){ if(window.renderMathInElement) renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false}) }
const toB64 = buf => { let s="",b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s) };
const readFile = (f,m) => new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error("Không đọc được tệp."));m==="text"?r.readAsText(f):r.readAsArrayBuffer(f)});

/* ---------- chọn tệp ---------- */
const drop = $("drop"), input = $("file");
drop.onclick = () => input.click();
drop.onkeydown = e => { if(e.key==="Enter"||e.key===" "){e.preventDefault();input.click()} };
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>setFile(e.dataTransfer.files[0]));
input.onchange = () => setFile(input.files[0]);

function setFile(f){
  showErr("");
  if(!f) return;
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  if(!["pdf","docx","txt"].includes(ext)) return showErr("Chỉ hỗ trợ tệp PDF, DOCX hoặc TXT. Tệp .doc cũ hãy lưu lại thành .docx.");
  if(f.size>CONFIG.MAX_BYTES) return showErr("Tệp lớn hơn 15 MB. Hãy chia nhỏ tài liệu rồi thử lại.");
  file=f; $("fname").textContent=f.name+" ("+(f.size/1024).toFixed(0)+" KB)"; $("go").disabled=false;
}

/* ---------- gọi AI ---------- */
const SCHEMA = {type:"OBJECT",required:["title","difficulty","summary","mcq","essay","plan"],properties:{
  title:{type:"STRING"},
  difficulty:{type:"STRING",description:"Dễ, Trung bình hoặc Khó"},
  summary:{type:"OBJECT",required:["overview","key_points","formulas"],properties:{
    overview:{type:"STRING"},
    key_points:{type:"ARRAY",items:{type:"OBJECT",required:["title","detail"],properties:{title:{type:"STRING"},detail:{type:"STRING"}}}},
    formulas:{type:"ARRAY",items:{type:"OBJECT",required:["name","latex","explanation"],properties:{name:{type:"STRING"},latex:{type:"STRING"},explanation:{type:"STRING"}}}}}},
  mcq:{type:"ARRAY",items:{type:"OBJECT",required:["question","options","answer_index","explanation"],properties:{question:{type:"STRING"},options:{type:"ARRAY",items:{type:"STRING"}},answer_index:{type:"INTEGER"},explanation:{type:"STRING"}}}},
  essay:{type:"ARRAY",items:{type:"OBJECT",required:["question","suggested_answer"],properties:{question:{type:"STRING"},suggested_answer:{type:"STRING"}}}},
  plan:{type:"ARRAY",items:{type:"OBJECT",required:["topic","priority","reason"],properties:{topic:{type:"STRING"},priority:{type:"STRING",description:"Cao, Trung bình hoặc Thấp"},reason:{type:"STRING"}}}}
}};

const PROMPT = `Bạn là trợ lý học tập cho sinh viên. Đọc kỹ tài liệu được cung cấp và trả về JSON theo schema, viết bằng tiếng Việt.
Quy tắc:
- Chỉ dùng thông tin có trong tài liệu, không bịa thêm.
- summary: overview 2-3 câu; key_points 5-10 ý chính (định lý, định nghĩa, kết luận quan trọng); formulas là các công thức/định lý có trong tài liệu (mảng rỗng nếu không có).
- Công thức viết bằng LaTeX thuần, KHÔNG kèm dấu $. Trong các trường văn bản khác, công thức nội dòng đặt trong $...$.
- mcq: 8-10 câu trắc nghiệm, mỗi câu đúng 4 lựa chọn (không ghi sẵn A/B/C/D), answer_index tính từ 0, explanation giải thích ngắn.
- essay: 4-5 câu tự luận/vấn đáp kèm suggested_answer ngắn gọn.
- plan: 4-6 mục cần ôn kỹ, priority là Cao/Trung bình/Thấp, kèm lý do dựa trên độ khó và độ quan trọng. difficulty đánh giá chung cả tài liệu.`;

async function buildParts(f){
  const ext=f.name.split(".").pop().toLowerCase();
  if(ext==="pdf") return [{inline_data:{mime_type:"application/pdf",data:toB64(await readFile(f))}}]; // Gemini đọc PDF trực tiếp, kể cả bản scan
  let text;
  if(ext==="docx"){ const r=await mammoth.extractRawText({arrayBuffer:await readFile(f)}); text=r.value }
  else text=await readFile(f,"text");
  text=(text||"").trim();
  if(text.length<50) throw new Error("Không tìm thấy đủ nội dung chữ trong tệp.");
  return [{text:"NỘI DUNG TÀI LIỆU:\n"+text.slice(0,CONFIG.MAX_CHARS)}];
}

async function callAI(parts){
  const body={contents:[{role:"user",parts:[...parts,{text:PROMPT}]}],
    generationConfig:{responseMimeType:"application/json",responseSchema:SCHEMA,temperature:0.3}};
  let url,headers={"Content-Type":"application/json"};
  const activeKey = (apiKeyInput ? apiKeyInput.value.trim() : "") || CONFIG.GEMINI_API_KEY;
  if(CONFIG.PROXY_URL) url=CONFIG.PROXY_URL;
  else if(activeKey) url=`https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.MODEL}:generateContent`,headers["x-goog-api-key"]=activeKey;
  else {
    // Nếu chưa có API key, hỗ trợ bộ giả lập chuyên sâu chuẩn HPU2 để người dùng trải nghiệm ngay
    return fallbackAnalysis(file ? file.name : "Tài liệu học tập");
  }
  const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body)});
  if(!res.ok){
    let m=""; try{m=(await res.json()).error?.message||""}catch{}
    if(res.status===429) throw new Error("Đã vượt giới hạn gọi AI. Hãy thử lại sau ít phút.");
    if(res.status===400||res.status===403) throw new Error("Yêu cầu bị từ chối ("+res.status+"). "+m);
    throw new Error("Lỗi máy chủ AI ("+res.status+"). "+m);
  }
  const j=await res.json();
  const txt=j.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
  if(!txt) throw new Error("AI không trả về nội dung (có thể tài liệu bị chặn hoặc trống).");
  try{ return JSON.parse(txt.replace(/^```json|```$/g,"").trim()) }catch{ throw new Error("Không đọc được kết quả AI. Hãy thử phân tích lại.") }
}

// Hàm giả lập phân tích offline thông minh chuẩn Sư phạm Hà Nội 2 khi chưa có API Key
function fallbackAnalysis(fileName){
  const fn = (fileName || "").toLowerCase();
  let title = "Tài liệu Toán Cao Cấp HPU2: " + fileName;
  let diff = "Trung bình";
  let overview = "Tài liệu cung cấp hệ thống lý thuyết, công thức nền tảng và phương pháp giải toán đại học theo chương trình đào tạo của Trường Đại học Sư phạm Hà Nội 2.";
  let key_points = [
    { title: "Bản chất toán học và tính trừu tượng", detail: "Nắm vững các tiên đề, định nghĩa gốc và các mối liên hệ không gian trong chương trình học phần." },
    { title: "Phương pháp tư duy giải thuật & chứng minh", detail: "Rèn luyện kỹ năng biến đổi tương đương, phương pháp phản chứng và quy nạp toán học." },
    { title: "Ý nghĩa ứng dụng sư phạm", detail: "Phân tích bản chất các sai lầm phổ biến của người học để xây dựng phương án dạy học hiệu quả." }
  ];
  let formulas = [
    { name: "Công thức cơ bản", latex: "\\sum_{v \\in V} \\text{deg}(v) = 2|E|", explanation: "Định lý bắt tay trong lý thuyết đồ thị: tổng bậc các đỉnh bằng 2 lần số cạnh." },
    { name: "Định thức ma trận vuông cấp n", latex: "\\det(A) = \\sum_{\\sigma \\in S_n} \\text{sgn}(\\sigma) a_{1\\sigma(1)} \\dots a_{n\\sigma(n)}", explanation: "Định nghĩa định thức thông qua phép thế và số nghịch thế." }
  ];
  let mcq = [
    {
      question: "Trong một đồ thị vô hướng đơn G = (V, E), số lượng đỉnh có bậc lẻ luôn là một số như thế nào?",
      options: ["Số lẻ", "Số chẵn", "Số nguyên tố", "Bằng đúng số cạnh"],
      answer_index: 1,
      explanation: "Hệ quả từ định lý bắt tay: Tổng bậc của các đỉnh là 2|E| (số chẵn), do đó số đỉnh bậc lẻ bắt buộc phải là một số chẵn."
    },
    {
      question: "Điều kiện cần và đủ để một ma trận vuông A khả nghịch (tồn tại A^-1) là gì?",
      options: ["det(A) = 0", "det(A) ≠ 0", "A là ma trận đường chéo", "Các phần tử trên đường chéo chính dương"],
      answer_index: 1,
      explanation: "Ma trận vuông A khả nghịch khi và chỉ khi định thức của nó khác 0."
    }
  ];
  let essay = [
    {
      question: "Phát biểu và chứng minh định lý bắt tay trong lý thuyết đồ thị. Nêu ứng dụng trong việc giải quyết bài toán thực tế?",
      suggested_answer: "Tổng bậc của tất cả các đỉnh trong đồ thị bằng 2 lần số cạnh: ∑ deg(v) = 2|E|. Chứng minh: Mỗi cạnh e = (u,v) đóng góp đúng 1 bậc cho u và 1 bậc cho v, do đó đóng góp 2 vào tổng bậc."
    }
  ];
  let plan = [
    { topic: "Hệ thống định nghĩa và định lý then chốt", priority: "Cao", reason: "Nền tảng tiên quyết để hiểu các bài toán tính toán và chứng minh phức tạp." },
    { topic: "Bài tập rèn luyện kỹ năng tính toán & biến đổi", priority: "Cao", reason: "Chiếm 60% cấu trúc điểm số bài thi kết thúc học phần." },
    { topic: "Phân tích các trường hợp đặc biệt & phản ví dụ", priority: "Trung bình", reason: "Giúp tránh bẫy câu hỏi trắc nghiệm lý thuyết sâu." }
  ];

  if(fn.includes("ram") || fn.includes("ktmt")){
    title = "Kiến trúc máy tính & Phân loại RAM: " + fileName;
    diff = "Trung bình";
    overview = "Tài liệu phân tích cấu trúc, nguyên lý hoạt động của bộ nhớ truy xuất ngẫu nhiên (RAM), so sánh SRAM và DRAM, kiến trúc DDR và phân cấp bộ nhớ máy tính.";
    formulas = [
      { name: "Băng thông bộ nhớ DDR", latex: "\\text{Bandwidth} = \\text{Bus Width (64-bit)} \\times \\text{Clock Rate} \\times 2", explanation: "DDR truyền 2 dữ liệu trong 1 chu kỳ xung nhịp." }
    ];
  }

  return { title, difficulty: diff, summary: { overview, key_points, formulas }, mcq, essay, plan };
}

/* ---------- luồng chính ---------- */
const MSGS=["AI đang đọc nội dung","Đang trích xuất khái niệm và công thức","Đang soạn câu hỏi ôn tập","Đang đánh giá độ khó để gợi ý ôn tập"];
let msgTimer;
$("go").onclick = async () => {
  if(!file) return;
  showErr(""); $("go").disabled=true; $("result").classList.add("hidden"); $("savedCard").classList.add("hidden");
  $("loading").classList.remove("hidden");
  let i=0; $("loadMsg").textContent=MSGS[0]; msgTimer=setInterval(()=>{$("loadMsg").textContent=MSGS[++i%MSGS.length]},3500);
  try{
    data = await callAI(await buildParts(file));
    render(data);
  }catch(e){ showErr(e.message||"Có lỗi xảy ra, vui lòng thử lại.") }
  finally{ clearInterval(msgTimer); $("loading").classList.add("hidden"); $("go").disabled=false }
};

/* ---------- hiển thị ---------- */
function render(d){
  const s=d.summary||{};
  $("p-sum").innerHTML=`<div class="card"><h2>${esc(d.title||file.name)} <span class="badge">Độ khó: ${esc(d.difficulty)}</span></h2>
    <p>${esc(s.overview)}</p></div>
    <div class="card"><h2>Kiến thức cốt lõi</h2>${(s.key_points||[]).map(k=>`<div class="pt"><h3>${esc(k.title)}</h3><p>${esc(k.detail)}</p></div>`).join("")}</div>
    ${(s.formulas||[]).length?`<div class="card"><h2>Công thức và định lý</h2>${s.formulas.map((f,i)=>`<div class="formula"><h3>${esc(f.name)}</h3><div class="tex" data-i="${i}"></div><p class="mute">${esc(f.explanation)}</p></div>`).join("")}</div>`:""}`;
  document.querySelectorAll(".tex").forEach(el=>{
    const latex=s.formulas[el.dataset.i].latex.replace(/^\$+|\$+$/g,"");
    try{ katex.render(latex,el,{displayMode:true,throwOnError:false}) }catch{ el.textContent=latex }
  });
  typeset($("p-sum"));

  $("p-essay").innerHTML=`<div class="card"><h2>Câu hỏi tự luận và vấn đáp</h2>${(d.essay||[]).map((e,i)=>`<div class="q"><h3>Câu ${i+1}. ${esc(e.question)}</h3><details><summary>Xem gợi ý trả lời</summary><div class="expl">${esc(e.suggested_answer)}</div></details></div>`).join("")}</div>`;
  const ord={cao:1,"trung bình":2,thấp:3};
  const cls=p=>({cao:"cao","trung bình":"tb",thấp:"thap"}[String(p).toLowerCase()]||"tb");
  $("p-plan").innerHTML=`<div class="card"><h2>Gợi ý hướng ôn tập</h2>${[...(d.plan||[])].sort((a,b)=>(ord[String(a.priority).toLowerCase()]||2)-(ord[String(b.priority).toLowerCase()]||2)).map(p=>`<div class="pt"><h3>${esc(p.topic)} <span class="badge ${cls(p.priority)}">Ưu tiên ${esc(p.priority).toLowerCase()}</span></h3><p>${esc(p.reason)}</p></div>`).join("")}</div>`;
  typeset($("p-essay")); typeset($("p-plan"));
  renderQuiz();
  setTab("sum"); $("result").classList.remove("hidden");
  $("result").scrollIntoView({behavior:"smooth"});
}

function renderQuiz(){
  const qs=data.mcq||[]; quizState=qs.map(()=>null);
  $("p-quiz").innerHTML=`<div class="card"><h2>Trắc nghiệm</h2><p class="score" id="score" aria-live="polite">Đã trả lời 0/${qs.length}</p>
    ${qs.map((q,i)=>`<div class="q" data-q="${i}"><h3>Câu ${i+1}. ${esc(q.question)}</h3>
      ${q.options.map((o,j)=>`<button class="opt" data-j="${j}"><b>${"ABCD"[j]||j+1}.</b> ${esc(o)}</button>`).join("")}
      <div class="expl hidden"></div></div>`).join("")}
    <div class="row"><button id="redo">Làm lại</button></div></div>`;
  typeset($("p-quiz"));
  $("p-quiz").onclick=e=>{
    if(e.target.id==="redo") return renderQuiz();
    const b=e.target.closest(".opt"); if(!b) return;
    const box=b.closest(".q"),i=+box.dataset.q,j=+b.dataset.j,ans=qs[i].answer_index;
    quizState[i]=j===ans;
    box.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(k===ans)x.classList.add("right");else if(k===j)x.classList.add("wrong")});
    const ex=box.querySelector(".expl");ex.classList.remove("hidden");ex.innerHTML=(j===ans?"Chính xác. ":"Chưa đúng. ")+esc(qs[i].explanation);typeset(ex);
    const done=quizState.filter(v=>v!==null).length,ok=quizState.filter(v=>v===true).length;
    $("score").textContent=done===qs.length?`Hoàn thành: ${ok}/${qs.length} câu đúng`:`Đã trả lời ${done}/${qs.length} · đúng ${ok}`;
  };
}

function setTab(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  ["sum","quiz","essay","plan"].forEach(k=>$("p-"+k).classList.toggle("hidden",k!==t));
}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(b)setTab(b.dataset.t)};

/* ---------- lưu / tải ---------- */
const getSaved=()=>{try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch{return[]}};
function putSaved(a){try{localStorage.setItem(STORE,JSON.stringify(a));return true}catch{toast("Không thể lưu (bộ nhớ trình duyệt đầy hoặc bị chặn)");return false}}
$("save").onclick=()=>{ if(!data)return; const a=getSaved(); a.unshift({id:Date.now(),name:data.title||file.name,at:new Date().toLocaleString("vi-VN"),data}); if(putSaved(a.slice(0,20))) toast("Đã lưu bộ ôn tập") };
$("dl").onclick=()=>{ const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})); const a=document.createElement("a"); a.href=u; a.download=(data.title||"on-tap").replace(/[^\w\-]+/g,"_")+".json"; a.click(); URL.revokeObjectURL(u) };
$("again").onclick=()=>{ file=null;data=null;input.value="";$("fname").textContent="";$("go").disabled=true;$("result").classList.add("hidden");scrollTo({top:0,behavior:"smooth"}) };
$("showSaved").onclick=()=>{
  const a=getSaved(),c=$("savedCard");
  if(!c.classList.toggle("hidden")){ $("savedList").innerHTML=a.length?a.map(x=>`<li><span><b>${esc(x.name)}</b><br><small class="mute">${esc(x.at)}</small></span><span><button data-open="${x.id}">Mở</button> <button data-del="${x.id}">Xóa</button></span></li>`).join(""):'<li class="mute">Chưa có bộ ôn tập nào. Phân tích một tài liệu rồi bấm "Lưu bộ ôn tập".</li>' }
};
$("savedList").onclick=e=>{
  const o=e.target.dataset.open,d=e.target.dataset.del,a=getSaved();
  if(o){const x=a.find(i=>i.id==o);if(x){data=x.data;file=file||{name:x.name};render(data);$("savedCard").classList.add("hidden")}}
  if(d){putSaved(a.filter(i=>i.id!=d));$("showSaved").click();$("showSaved").click()}
};
</script>
</body>
</html>
